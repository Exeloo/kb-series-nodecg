<!DOCTYPE html>
<html lang="fr">
<head>
	<meta charset="utf-8">
	<title>KB SERIES · Import tracker.gg</title>
	<style>
		:root { --bg: #0a0f2e; --panel: #111845; --line: #2a3480; --text: #f3f1ea; --muted: #8e9ac8; --blue: #3b8fe6; --gold: #c9b274; --red: #ff4655; --ok: #3ddc97; }
		* { box-sizing: border-box; }
		body { margin: 0; width: 320px; padding: 12px; background: var(--bg); color: var(--text); font: 13px/1.4 'Segoe UI', system-ui, sans-serif; }
		h1 { margin: 0 0 2px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
		.sub { color: var(--muted); font-size: 11px; }
		.card { margin-top: 10px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
		.status { display: flex; align-items: center; gap: 8px; }
		.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line); flex: 0 0 auto; }
		.dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); } .dot.err { background: var(--red); } .dot.busy { background: var(--blue); box-shadow: 0 0 6px var(--blue); }
		ul { list-style: none; margin: 6px 0 0; padding: 0; max-height: 220px; overflow-y: auto; }
		li { padding: 4px 0; border-top: 1px solid var(--line); font-size: 12px; }
		li:first-child { border-top: 0; }
		li b { font-weight: 600; } li .ok { color: var(--ok); } li .err { color: var(--red); } li small { color: var(--muted); display: block; }
		button { width: 100%; margin-top: 10px; background: var(--blue); border: 1px solid var(--blue); color: #fff; border-radius: 4px; padding: 8px; font: 600 13px 'Segoe UI', sans-serif; cursor: pointer; }
		.empty { color: var(--muted); font-style: italic; font-size: 12px; }
		.warn { border-color: var(--gold); } .warn button { background: var(--gold); border-color: var(--gold); color: #0a0f2e; margin-top: 8px; }
		.hidden { display: none; }
	</style>
</head>
<body>
	<h1>KB SERIES · Import tracker.gg</h1>
	<div class="sub" id="ver"></div>
	<div class="card warn hidden" id="perm">
		<div class="status"><span class="dot err"></span><span>Accès aux sites non autorisé : l'extension ne peut ni lire tracker.gg ni parler à la régie.</span></div>
		<button id="permBtn">Autoriser l'accès (tracker.gg et régie)</button>
	</div>
	<div class="card">
		<div class="status"><span class="dot" id="ncgDot"></span><span id="ncg">Régie NodeCG…</span></div>
		<div class="status" style="margin-top:6px"><span class="dot" id="qDot"></span><span id="queue">Aucun import en cours</span></div>
	</div>
	<div class="card">
		<div class="sub">Derniers imports</div>
		<ul id="log"><li class="empty">Aucun import pour l'instant.</li></ul>
	</div>
	<button id="open">Ouvrir la régie</button>
	<script src="popup.js"></script>
</body>
</html>
