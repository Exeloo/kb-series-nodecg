<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>KB SERIES · Stream (toutes les couches)</title>
	<!--
		Page maîtresse : UNE seule source navigateur OBS (1920×1080) qui contient tous les overlays, chacun dans son iframe.
		Couches (de bas en haut) :
		  1. Scène de fond choisie dans la régie (Bientôt, Pause, Fin, Planning, 50/50) — ou rien (jeu en dessous dans OBS)
		  2. Overlays plein écran (versus, veto, maps, joueurs, bracket…) — chacun gère son affichage via son replicant
		  3. Overlays en jeu (lower thirds, ticker)
		  4. Transition (stinger) tout en haut
		Replicant lu : `streamScene` = { scene: 'none'|'starting'|'brb'|'ending'|'schedule'|'dual-cam', via: 'cut'|'fade', at },
		piloté par la régie (dashboard/regie.html). Le rechargement automatique (kb.js) recharge cette page, donc toutes les couches.
	-->
	<style>
		html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
		iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; background: transparent; pointer-events: none; }
		.scene { transition: opacity .5s ease; }
		.scene.pending { opacity: 0; }
		.scene.cut { transition: none; }
	</style>
</head>
<body>
	<div id="scenes"></div>
	<div id="layers"></div>
	<script src="../shared/kb.js"></script>
	<script src="../shared/defaults.js"></script>
	<script>
		const BASE = './';
		// Ordre = ordre d'empilement (le dernier est au-dessus)
		const LAYERS = [
			'planning', 'groups', 'bracket',
			'map-series', 'map-intro', 'map-result',
			'veto', 'veto-recap', 'versus',
			'player-stats', 'player-duel',
			'lower-third', 'ticker', 'replay-bug',
			'transition',
		];
		const SCENES = ['starting', 'brb', 'ending', 'schedule', 'dual-cam'];
		const FADE_MS = 550;      // un peu plus que la transition CSS de .scene
		const LOAD_MAX_MS = 5000; // une scène qui ne finit pas de charger s'affiche quand même

		const layers = document.getElementById('layers');
		for (const name of LAYERS) {
			const f = document.createElement('iframe');
			f.src = BASE + name + '.html';
			f.title = name;
			f.dataset.layer = name;
			layers.appendChild(f);
		}

		// ---------- Scène de fond ----------
		// La nouvelle scène se charge invisible (.pending) PAR-DESSUS l'ancienne, qui reste à l'écran jusqu'à ce que
		// la nouvelle soit prête : jamais de trou entre deux scènes. Seule la dernière scène demandée compte.
		const scenesBox = document.getElementById('scenes');
		let current = { scene: 'none', el: null }; // scène à l'écran
		let next = null;                           // scène en cours de chargement { scene, el, timer }

		function cancelNext() {
			if (!next) return;
			clearTimeout(next.timer);
			next.el.remove();
			next = null;
		}

		function show(scene, fade) {
			if (!SCENES.includes(scene)) scene = 'none';
			if (scene === (next ? next.scene : current.scene)) return;
			cancelNext();
			if (scene === current.scene) return; // retour à la scène affichée pendant un chargement

			if (scene === 'none') {
				const old = current.el;
				current = { scene, el: null };
				if (fade) { old.classList.remove('cut'); old.classList.add('pending'); setTimeout(() => old.remove(), FADE_MS); } else old.remove();
				return;
			}

			const el = document.createElement('iframe');
			el.className = 'scene pending' + (fade ? '' : ' cut');
			el.src = BASE + scene + '.html';
			el.title = scene;
			scenesBox.appendChild(el);
			const n = next = { scene, el, timer: 0 };
			const reveal = () => {
				if (next !== n) return; // remplacée entre-temps par une autre demande
				clearTimeout(n.timer);
				next = null;
				const old = current.el;
				current = { scene, el };
				el.classList.remove('pending');
				// Coupe : l'ancienne disparaît dans la même image ; fondu : elle reste dessous jusqu'à la fin du fondu
				if (old) { if (fade) setTimeout(() => old.remove(), FADE_MS); else old.remove(); }
			};
			// load = document de la scène chargé ; 2 images de plus pour qu'il soit peint avant d'être révélé
			el.addEventListener('load', () => requestAnimationFrame(() => requestAnimationFrame(reveal)), { once: true });
			n.timer = setTimeout(reveal, LOAD_MAX_MS);
		}

		const streamScene = nodecg.Replicant('streamScene', { defaultValue: KBDefaults.streamScene() });
		let first = true;
		streamScene.on('change', (v) => {
			if (!v) return;
			show(v.scene, !first && v.via === 'fade'); // au chargement de la page : pas de fondu
			first = false;
		});
	</script>
</body>
</html>
