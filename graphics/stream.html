<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>KB SERIES · Stream (toutes les couches)</title>
	<!--
		Page maîtresse : UNE seule source navigateur OBS (1920×1080) qui contient tous les overlays, chacun dans son iframe.
		Couches (de bas en haut) :
		  1. Scène de fond choisie dans la régie (Bientôt, Pause, Fin, Planning, 50/50) — ou rien (jeu en dessous dans OBS)
		  2. Overlays plein écran (versus, veto, maps, joueurs, bracket…) — chacun gère son affichage via son replicant
		  3. Overlays en jeu (lower thirds, ticker)
		  4. Transition (stinger) tout en haut
		Replicant lu : `streamScene` = { scene: 'none'|'starting'|'brb'|'ending'|'schedule'|'dual-cam', via: 'cut'|'fade', at },
		piloté par la régie (dashboard/regie.html). Les écrans de fond sont tous chargés au démarrage (en pause tant qu'ils sont masqués) :
		en changer ne recharge aucune page. Le rechargement automatique (kb.js) recharge cette page, donc toutes les couches.
	-->
	<style>
		html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: transparent; }
		iframe { position: absolute; inset: 0; width: 1920px; height: 1080px; border: 0; background: transparent; pointer-events: none; }
		/* Deux contextes d'empilement : les écrans de fond (z-index entre eux) restent toujours sous les overlays */
		#scenes, #layers { position: absolute; inset: 0; }
		#scenes { z-index: 0; } #layers { z-index: 1; }
		.scene { transition: opacity .5s ease; }
		.scene.pending { opacity: 0; }
		.scene.cut { transition: none; }
	</style>
</head>
<body>
	<div id="scenes"></div>
	<div id="layers"></div>
	<script src="../shared/kb.js"></script>
	<script src="../shared/defaults.js"></script>
	<script>
		const BASE = './';
		// Ordre = ordre d'empilement (le dernier est au-dessus)
		const LAYERS = [
			'planning', 'groups', 'bracket',
			'map-series', 'map-intro', 'map-result',
			'veto', 'veto-recap', 'versus',
			'player-stats', 'player-duel',
			'lower-third', 'ticker', 'replay-bug',
			'transition',
		];
		const SCENES = ['starting', 'brb', 'ending', 'schedule', 'dual-cam'];
		const FADE_MS = 550;      // un peu plus que la transition CSS de .scene

		const layers = document.getElementById('layers');
		for (const name of LAYERS) {
			const f = document.createElement('iframe');
			f.src = BASE + name + '.html';
			f.title = name;
			f.dataset.layer = name;
			layers.appendChild(f);
		}

		// ---------- Scène de fond ----------
		// Les écrans de fond sont chargés une fois pour toutes au démarrage, invisibles et en pause (.kb-idle) : en changer ne
		// recharge rien (sur une régie en ligne, recharger une page prenait 1 à 3 s). La scène demandée passe au-dessus,
		// ses entrées sont rejouées, puis l'ancienne est masquée (tout de suite en coupe, après le fondu sinon).
		const scenesBox = document.getElementById('scenes');
		const frames = {};      // scène → { el, loaded }
		let current = 'none';   // scène à l'écran (ou demandée, en attente de son chargement)
		let z = 1, wait = null; // wait : scène pas encore chargée, révélée à son chargement
		const doc = (f) => { try { return f.el.contentDocument; } catch { return null; } };
		// Animations en pause tant que l'écran est masqué (même règle que les overlays : theme.css, .kb-idle)
		const idle = (f, on) => { const d = doc(f); if (d && d.documentElement) d.documentElement.classList.toggle('kb-idle', on); };
		// Rejoue les entrées de la page (classes .kb-in / .kb-settled posées par KB.scene, KBScenes.enter, KBPV…)
		function replay(f) {
			const d = doc(f);
			if (!d) return;
			for (const el of d.querySelectorAll('.kb-in')) {
				const settled = el.classList.contains('kb-settled');
				el.classList.remove('kb-in', 'kb-settled');
				void el.offsetWidth;
				el.classList.add('kb-in');
				if (settled) setTimeout(() => el.classList.add('kb-settled'), 3000);
			}
		}
		for (const scene of SCENES) {
			const el = document.createElement('iframe');
			el.className = 'scene pending cut';
			el.src = BASE + scene + '.html';
			el.title = scene;
			const f = frames[scene] = { el, loaded: false };
			el.addEventListener('load', () => {
				f.loaded = true;
				idle(f, current !== scene);
				if (wait === scene) { wait = null; reveal(scene, false); }
			});
			scenesBox.appendChild(el);
		}

		function hideFrame(f, fade) {
			const done = () => { if (current !== f.el.title) { f.el.classList.add('cut', 'pending'); idle(f, true); } };
			if (fade) { f.el.classList.remove('cut'); f.el.classList.add('pending'); setTimeout(done, FADE_MS); } else done();
		}
		function reveal(scene, fade) {
			const f = frames[scene];
			idle(f, false);
			replay(f);
			f.el.style.zIndex = ++z;
			f.el.classList.toggle('cut', !fade);
			void f.el.offsetWidth;
			f.el.classList.remove('pending');
			// Coupe : les autres disparaissent dans la même image ; fondu : elles restent dessous jusqu'à la fin du fondu
			for (const [name, o] of Object.entries(frames)) if (name !== scene && !o.el.classList.contains('pending')) {
				if (fade) setTimeout(() => { if (current === scene) hideFrame(o, false); }, FADE_MS); else hideFrame(o, false);
			}
		}
		function show(scene, fade) {
			if (!SCENES.includes(scene)) scene = 'none';
			if (scene === current) return;
			current = scene;
			wait = null;
			if (scene === 'none') { for (const f of Object.values(frames)) if (!f.el.classList.contains('pending')) hideFrame(f, fade); return; }
			if (frames[scene].loaded) reveal(scene, fade);
			else wait = scene; // encore en chargement (juste après l'ouverture de la page) : révélée dès qu'elle est prête
		}

		const streamScene = nodecg.Replicant('streamScene', { defaultValue: KBDefaults.streamScene() });
		let first = true;
		streamScene.on('change', (v) => {
			if (!v) return;
			show(v.scene, !first && v.via === 'fade'); // au chargement de la page : pas de fondu
			first = false;
		});
	</script>
</body>
</html>
