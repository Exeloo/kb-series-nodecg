<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>Stats joueur</title>
	<!--
		Fiche plein écran d'un joueur : photo (ou emblème), 3 agents, rangs et stats (tracker.gg + saisie manuelle, via KB.player).
		Deux vues (playerStatsGraphic.view, KBP.VIEWS) : « overview » = rangs + 6 cartes de stats ; « roles » = tableau des performances
		par rôle (Duelliste, Initiateur, Contrôleur, Sentinelle ; KB.player().roles, KBP.roleRows).
		Replicants lus : playerStatsGraphic (défaut : KBP.STATS_DEFAULT, shared/player.js), playerProfiles, playerData, teams, match
		(agent pické sur la map en cours), valorantData, tournament. Piloté par le panneau Stats Joueur (dashboard/player-stats.html).
	-->
	<link rel="stylesheet" href="../shared/theme.css">
	<style>
		:root { --team: var(--kb-blue); }

		/* ---------- Scène ---------- */
		#scene { position: absolute; inset: 0; visibility: hidden; clip-path: inset(0 100% 0 0); }
		#scene.kb-in { animation: wipeIn .75s var(--kb-ease-inout) forwards; }
		#scene.kb-out { animation: wipeOut .45s var(--kb-ease-inout) forwards; }
		@keyframes wipeIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
		@keyframes wipeOut { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }

		/* Filet doré diagonal + reflet lumineux qui le parcourt en boucle */
		#slash { position: absolute; left: 912px; top: -120px; width: 4px; height: 1320px; transform: skewX(-12deg); overflow: hidden;
			background: linear-gradient(180deg, transparent, var(--kb-gold) 20%, var(--kb-gold-hi) 50%, var(--kb-gold) 80%, transparent); box-shadow: 0 0 14px rgba(245, 196, 69, .5); }
		#slash::after { content: ''; position: absolute; left: -6px; right: -6px; height: 260px; top: -300px; background: linear-gradient(180deg, transparent, #fff, transparent); opacity: .9; animation: sweepY 5s ease-in-out 1.6s infinite; }
		@keyframes sweepY { 0% { transform: none; } 55%, 100% { transform: translateY(1700px); } }

		/* Particules qui montent lentement (ambiance) */
		#motes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
		#motes i { position: absolute; bottom: -20px; width: 4px; height: 4px; border-radius: 50%; background: var(--kb-blue-hi); box-shadow: 0 0 10px var(--kb-blue-hi); opacity: 0; animation: mote linear infinite; }
		@keyframes mote { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 85% { opacity: .5; } 100% { transform: translateY(-900px) translateX(40px); opacity: 0; } }

		/* ---------- Visuel : photo du joueur + 3 agents en profondeur ---------- */
		#visual { position: absolute; left: 0; top: 0; width: 960px; height: 1080px; overflow: hidden; }
		/* Halo + forme à la couleur de l'équipe derrière la photo (respirent doucement) */
		#halo { position: absolute; left: 130px; top: 110px; width: 680px; height: 680px; border-radius: 50%;
			background: radial-gradient(circle, color-mix(in srgb, var(--team) 70%, transparent) 0%, color-mix(in srgb, var(--team) 22%, transparent) 45%, transparent 70%);
			animation: breathe 6s ease-in-out infinite; }
		@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.07); opacity: 1; } }
		#shape { position: absolute; left: 270px; top: 150px; width: 400px; height: 720px; transform: skewX(-12deg); overflow: hidden;
			background: linear-gradient(180deg, color-mix(in srgb, var(--team) 50%, transparent), color-mix(in srgb, var(--team) 10%, transparent) 70%, transparent);
			border: 2px solid color-mix(in srgb, var(--team) 70%, white 10%); border-bottom: 0; box-shadow: 0 0 40px color-mix(in srgb, var(--team) 40%, transparent);
			mask-image: linear-gradient(180deg, #000 55%, transparent 95%); }
		#shape::after { content: ''; position: absolute; top: 0; bottom: 0; width: 45%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .22), transparent); animation: kb-shine 7s ease-in-out 2s infinite; }

		/* Photo : ancrée en bas, centrée sur l'axe du visuel, fondue en bas ; légère lévitation */
		#photoBox { position: absolute; left: 470px; bottom: 150px; width: 0; height: 0; }
		#photo { position: absolute; left: 0; bottom: 0; height: 800px; width: auto; max-width: none; transform: translateX(-50%);
			mask-image: linear-gradient(180deg, #000 70%, transparent 98%); filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .55)); }
		#photoFloat { position: absolute; inset: 0; animation: float 7s ease-in-out 1.8s infinite; }
		@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
		#scene.kb-in #photoBox { animation: photoIn 1.3s var(--kb-ease-out) .25s both; }
		@keyframes photoIn { from { opacity: 0; transform: translateY(60px) scale(1.12); filter: blur(12px) brightness(2); } to { opacity: 1; transform: none; filter: none; } }
		/* Placeholder sans photo : grand emblème estompé */
		#emblem { position: absolute; left: 220px; top: 150px; width: 500px; height: 500px; display: grid; place-items: center; opacity: .22; filter: grayscale(.3); animation: breathe 6s ease-in-out infinite; }
		#emblem img, #emblem .kb-team-mono { width: 100% !important; height: 100% !important; object-fit: contain; }
		#emblem .kb-team-mono { font-size: 150px !important; }

		/* Agents : 1er devant, 2e derrière à gauche, 3e encore derrière à droite */
		.ag { position: absolute; }
		.ag .in { position: absolute; inset: 0; }
		.ag img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; }
		/* Lueur à la couleur de l'agent : ovale (60 % × 55 % du bloc) adouci sur ~210 px par un masque en dégradé
		   (même rendu qu'un flou de 70 px, sans filter: blur, coûteux sous OBS). L'opacité compense l'ovale plus petit des agents de fond. */
		.ag .in::before { content: ''; position: absolute; left: calc(20% - 210px); top: calc(18% - 210px); width: calc(60% + 420px); height: calc(55% + 420px); background: var(--c); opacity: .45;
			mask-image: radial-gradient(closest-side, rgba(0, 0, 0, .91), rgba(0, 0, 0, .89) 8.3%, rgba(0, 0, 0, .83) 16.7%, rgba(0, 0, 0, .725) 25%, rgba(0, 0, 0, .58) 33.3%, rgba(0, 0, 0, .42) 41.7%,
				rgba(0, 0, 0, .27) 50%, rgba(0, 0, 0, .15) 58.3%, rgba(0, 0, 0, .074) 66.7%, rgba(0, 0, 0, .03) 75%, rgba(0, 0, 0, .01) 83.3%, transparent); }
		.ag.a1 .in::before { opacity: .41; }
		.ag.a2 .in::before { opacity: .365; }
		.ag .tag { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); white-space: nowrap; text-align: center; padding: 6px 18px 7px; background: rgba(4, 6, 26, .85); border-bottom: 3px solid var(--c); }
		.ag .tag .n { font: 400 28px/1 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; }
		.ag .tag .s { font: 700 15px var(--kb-num); letter-spacing: .1em; color: var(--kb-muted); text-transform: uppercase; margin-top: 2px; }
		.ag .tag .s b { color: var(--kb-text); font-weight: 700; }
		.ag .tag .pk { display: inline-block; margin-bottom: 4px; padding: 1px 8px; background: var(--kb-gold); color: var(--kb-ink); font: 700 11px var(--kb-ui); letter-spacing: .2em; text-transform: uppercase; }
		.ag.a0 { left: 230px; top: 520px; width: 540px; height: 540px; z-index: 3; }
		.ag.a1 { left: 20px; top: 480px; width: 460px; height: 460px; z-index: 2; }
		.ag.a1 img { filter: brightness(.6) saturate(.85) blur(.6px); }
		.ag.a2 { left: 540px; top: 440px; width: 400px; height: 400px; z-index: 1; }
		.ag.a2 img { filter: brightness(.45) saturate(.75) blur(1.4px); }
		.ag.a0 .tag { bottom: 64px; }
		.ag.a1 .tag { transform: translateX(-50%) scale(.9); bottom: 36px; }
		.ag.a2 .tag { transform: translateX(-50%) scale(.82); bottom: 64px; }
		/* Entrée cinématique : l'agent de devant monte en zoomant, ceux de derrière glissent depuis la profondeur */
		#scene.kb-in .ag.a0 { animation: agFront 1.1s var(--kb-ease-out) .55s both; }
		#scene.kb-in .ag.a1 { animation: agLeft 1.1s var(--kb-ease-out) .75s both; }
		#scene.kb-in .ag.a2 { animation: agRight 1.1s var(--kb-ease-out) .9s both; }
		@keyframes agFront { from { opacity: 0; transform: translateY(80px) scale(.86); filter: brightness(3) blur(6px); } 60% { filter: brightness(1.4) blur(0); } to { opacity: 1; transform: none; filter: none; } }
		@keyframes agLeft { from { opacity: 0; transform: translateX(120px) scale(.8); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
		@keyframes agRight { from { opacity: 0; transform: translateX(-120px) scale(.8); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
		/* Boucle : respiration légère décalée */
		.ag.a0 .in { animation: float 6s ease-in-out 2s infinite; }
		.ag.a1 .in { animation: float 7s ease-in-out 2.6s infinite reverse; }
		.ag.a2 .in { animation: float 8s ease-in-out 3.1s infinite; }

		#floor { position: absolute; left: 0; right: 0; bottom: 0; height: 200px; z-index: 4; background: linear-gradient(180deg, transparent, rgba(4, 6, 26, .88)); pointer-events: none; }

		#brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; z-index: 5; }
		#brand img { width: 96px; height: 96px; }
		#brand .t { font: 400 28px/1 var(--kb-display); letter-spacing: .04em; }
		#brand .s { font: 600 13px var(--kb-ui); letter-spacing: .28em; color: var(--kb-gold); text-transform: uppercase; margin-top: 4px; }
		#brand .lg { position: relative; overflow: hidden; border-radius: 50%; }
		#brand .lg::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent); transform: skewX(-20deg); animation: kb-shine 5s ease-in-out 2.5s infinite; }

		/* ---------- Stats ---------- */
		#content { position: absolute; left: 1050px; top: 96px; right: 88px; bottom: 96px; display: flex; flex-direction: column; }
		.kicker { display: flex; align-items: center; gap: 16px; white-space: nowrap; }
		.kicker::before { content: ''; width: 46px; height: 3px; background: var(--kb-gold); box-shadow: 0 0 10px rgba(245, 196, 69, .5); }
		.kicker .kb-label { letter-spacing: .16em; }

		#name { position: relative; margin-top: 8px; font: 400 140px/0.95 var(--kb-display); text-transform: uppercase; white-space: nowrap; }
		#name small { font-size: .34em; color: var(--kb-muted); margin-left: 12px; letter-spacing: .02em; }
		#real { font: 600 20px var(--kb-ui); letter-spacing: .2em; color: var(--kb-muted); text-transform: uppercase; margin-top: 4px; }
		#real:empty { display: none; }
		/* Reflet unique sur le pseudo à l'entrée */
		#name .sheen { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
		#name .sheen::after { content: ''; position: absolute; top: 0; bottom: 0; width: 30%; left: -40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .5), transparent); transform: skewX(-20deg); }
		#scene.kb-in #name .sheen::after { animation: sheenOnce 1.2s ease-in-out 1.3s both; }
		/* De -40 % à +130 % du pseudo = 170 % du pseudo, soit 566,7 % de la largeur du reflet (30 %) */
		@keyframes sheenOnce { from { transform: skewX(-20deg); } to { transform: translateX(566.7%) skewX(-20deg); } }

		#teamRow { display: flex; align-items: center; gap: 16px; margin-top: 14px; white-space: nowrap; min-height: 62px; }
		#teamRow .tn { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 400 42px/1.1 var(--kb-display); text-transform: uppercase; }
		#teamRow > :not(.tn) { flex: 0 0 auto; }
		#teamRow .kb-pill { padding: 6px 20px; font-size: 16px; }

		.kb-rule.sep { margin: 26px 0 0; width: 100%; transform-origin: left; position: relative; overflow: hidden; }
		#scene.kb-in .kb-rule.sep { animation: ruleIn .9s var(--kb-ease-out) .5s both; }
		.kb-rule.sep::after { content: ''; position: absolute; top: 0; bottom: 0; width: 120px; left: -140px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: sweepX 6s ease-in-out 2.5s infinite; }
		/* Filet de 782 px (colonne #content) : le reflet va de -140 px à 110 % du filet */
		@keyframes sweepX { 0% { transform: none; } 40%, 100% { transform: translateX(1000px); } }
		@keyframes ruleIn { from { transform: scaleX(0); } to { transform: none; } }

		#ranks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; margin-top: 26px; }
		.rank { display: flex; align-items: center; gap: 18px; padding: 14px 24px 14px 16px; white-space: nowrap; }
		.rank img { width: 80px; height: 80px; }
		#scene.kb-in .rank img { animation: kb-pop .7s var(--kb-ease-out) 1s both; }
		.rank .val { font: 400 44px/1.05 var(--kb-display); text-transform: uppercase; }
		.rank .sub { font: 600 16px var(--kb-num); color: var(--kb-muted); letter-spacing: .06em; }

		#stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; margin-top: auto; }
		.stat { padding: 20px 22px 22px; }
		.stat .kb-label { font-size: 18px; color: var(--kb-gold); }
		.stat .val { font: 400 74px/1 var(--kb-display); margin-top: 8px; white-space: nowrap; }
		.stat .sub { font: 700 20px var(--kb-num); color: var(--kb-muted); letter-spacing: .08em; margin-top: 2px; height: 24px; }
		.stat .bar { height: 6px; margin-top: 10px; background: rgba(140, 170, 255, .12); }
		.stat .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--kb-blue), var(--kb-blue-hi)); box-shadow: 0 0 10px var(--kb-blue-glow); transition: width 1.2s var(--kb-ease-out) .7s; }
		.stat .top { position: absolute; top: 22px; right: 22px; font: 700 18px var(--kb-num); letter-spacing: .08em; color: var(--kb-gold-hi); }
		.kb-anim--right { --d: .35s; }

		/* ---------- Vue « par rôle » ---------- */
		.v-roles #ranks, .v-roles #stats, :not(.v-roles) > #roles { display: none; }
		#roles { display: flex; flex-direction: column; justify-content: space-between; gap: 14px; flex: 1; margin-top: 26px; min-height: 0; }
		/* Ligne d'un rôle : icône à gauche sur deux lignes ; en haut nom + infos, en bas les 5 stats */
		.role { position: relative; display: grid; grid-template-columns: 76px minmax(0, 1fr); grid-template-rows: auto auto; column-gap: 18px; row-gap: 6px; align-items: center; padding: 12px 22px 18px 16px; }
		.role .ic { grid-row: 1 / 3; width: 76px; height: 76px; display: grid; place-items: center; }
		.role .ic img { width: 62px; height: 62px; object-fit: contain; filter: drop-shadow(0 0 8px rgba(140, 170, 255, .35)); }
		.role .who { display: flex; align-items: baseline; gap: 16px; min-width: 0; white-space: nowrap; }
		.role .rn { flex: 0 0 auto; font: 400 36px/1 var(--kb-display); text-transform: uppercase; }
		.role .rs { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 700 17px var(--kb-num); color: var(--kb-muted); letter-spacing: .08em; }
		.role .rs b { color: var(--kb-text); }
		.role .cells { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
		.role .cell { min-width: 0; }
		.role .cell .kb-label { font-size: 13px; color: var(--kb-gold); }
		.role .rv { font: 400 34px/1.05 var(--kb-display); white-space: nowrap; margin-top: 2px; }
		.role .rv.best { color: var(--kb-gold-hi); text-shadow: 0 0 14px rgba(245, 196, 69, .45); }
		/* Part du temps de jeu de ce rôle */
		.role .share { position: absolute; left: 18px; right: 20px; bottom: 8px; height: 4px; background: rgba(140, 170, 255, .12); }
		.role .share i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--kb-blue), var(--kb-blue-hi)); box-shadow: 0 0 8px var(--kb-blue-glow); transition: width 1.2s var(--kb-ease-out) .7s; }
		/* Rôle principal (le plus joué) : liseré doré + pastille */
		.role.main { box-shadow: inset 4px 0 0 var(--kb-gold), 0 0 24px rgba(245, 196, 69, .12); }
		.role.main .share i { background: linear-gradient(90deg, var(--kb-gold-dim), var(--kb-gold-hi)); box-shadow: 0 0 8px rgba(245, 196, 69, .5); }
		.role .pk { flex: 0 0 auto; align-self: center; padding: 2px 10px; background: var(--kb-gold); color: var(--kb-ink); font: 700 12px var(--kb-ui); letter-spacing: .2em; text-transform: uppercase; }
		/* ---------- Changement de vue à l'antenne : la nouvelle vue recouvre l'ancienne ----------
		   L'ancienne colonne est figée dans une copie (.vx-old) ; la nouvelle (#content.vx-new) arrive par-dessus en volet diagonal
		   (même angle que #slash, 190 px de décalage sur 888 px de haut) pendant que la copie est découpée au même rythme :
		   on ne voit jamais le fond entre les deux. Un filet doré (.vx-seam) suit la jonction. Durée : VX_MS (script). */
		.vx-old { z-index: 1; pointer-events: none; animation: vxOut .7s var(--kb-ease-inout) both; }
		.vx-old *, .vx-old *::before, .vx-old *::after { animation: none !important; transition: none !important; }
		#content.vx-new { z-index: 2; animation: vxIn .7s var(--kb-ease-inout) both; }
		/* Nouvelle vue déjà en place : une partie qui réapparaît (display) ne rejoue pas son entrée retardée */
		#content.kb-settled .rank img { animation: none; }
		@keyframes vxIn {
			from { clip-path: polygon(-190px 0, 0 0, -190px 100%, -190px 100%); }
			to { clip-path: polygon(-190px 0, calc(100% + 190px) 0, 100% 100%, -190px 100%); }
		}
		@keyframes vxOut {
			from { clip-path: polygon(0 0, calc(100% + 190px) 0, calc(100% + 190px) 100%, -190px 100%); }
			to { clip-path: polygon(calc(100% + 190px) 0, calc(100% + 190px) 0, calc(100% + 190px) 100%, 100% 100%); }
		}
		/* Filet de jonction : centré sur #content (left 1050, top 96, 782 × 888) ; à mi-hauteur la jonction est 95 px avant son sommet */
		.vx-seam { position: absolute; left: 1047px; top: 96px; width: 6px; height: 888px; z-index: 3; pointer-events: none;
			background: linear-gradient(180deg, transparent, var(--kb-gold) 12%, var(--kb-gold-hi) 50%, var(--kb-gold) 88%, transparent);
			box-shadow: 0 0 18px rgba(245, 196, 69, .7), 0 0 40px rgba(245, 196, 69, .35); animation: vxSeam .7s var(--kb-ease-inout) both; }
		@keyframes vxSeam { from { transform: translateX(-95px) skewX(-12deg); } to { transform: translateX(877px) skewX(-12deg); } }

		/* Rôle jamais joué cette saison : contenu estompé (l'opacité de la ligne elle-même est pilotée par son animation d'entrée) */
		.role.off > * { opacity: .38; }
		.role.off .rs { font-style: italic; }
	</style>
</head>
<body>
	<div id="scene">
		<div class="kb-bg"><div class="kb-bg__art"></div><div class="kb-bg__stars"></div><div class="kb-bg__grid"></div></div>
		<div id="motes"></div>
		<div id="visual">
			<div id="halo"></div><div id="shape"></div><div id="emblem"></div>
			<div id="photoBox"><div id="photoFloat"><img id="photo" alt=""></div></div>
			<div id="agents"></div>
			<div id="floor"></div>
		</div>
		<div id="slash"></div>
		<div id="brand" class="kb-anim kb-anim--pop" style="--i:0"><div class="lg"><img class="kb-logo" alt=""></div><div><div class="t" id="brandName">KB SERIES</div><div class="s" id="brandSub"></div></div></div>
		<div class="kb-frame"></div>

		<div id="content">
			<div class="kicker kb-anim kb-anim--right" style="--i:0"><span class="kb-kicker" id="kicker">Stats joueur</span><span class="kb-label" id="season"></span></div>
			<div id="name" class="kb-anim kb-anim--right" style="--i:1"></div>
			<div id="real" class="kb-anim kb-anim--right" style="--i:1"></div>
			<div id="teamRow" class="kb-anim kb-anim--right" style="--i:2"></div>
			<div class="kb-rule sep"></div>
			<div id="ranks" class="kb-anim kb-anim--right" style="--i:3"></div>
			<div id="stats"></div>
			<div id="roles"></div>
		</div>
	</div>

	<script src="../shared/kb.js"></script>
	<script src="../shared/player.js"></script>
	<script>
		// Libellé sous le nom du tournoi, à côté du logo (aucun champ du replicant tournament ne le contient tel quel)
		const BRAND_SUB = 'Édition Epitech';
		// Cartes de stats : libellé + clé dans KB.player().stats (la dernière porte aussi le bilan V/D)
		const STATS = [['K/D', 'kd'], ['ACS', 'acs'], ['ADR', 'adr'], ['HS%', 'hs'], ['KAST', 'kast'], ['Victoires', 'winPct']];

		const graphic = nodecg.Replicant('playerStatsGraphic', { defaultValue: KB.clone(KBP.STATS_DEFAULT) });
		const $ = (id) => document.getElementById(id);
		const esc = KB.esc;
		const presence = KB.presence($('scene'), 480);
		const v = (s) => (s && s.display) || '–';
		KB.$('#brand img').src = KB.img.kbs;
		$('brandSub').textContent = BRAND_SUB;
		KB.rep.tournament.on('change', (t) => { $('brandName').textContent = (t && t.name) || 'KB SERIES'; });
		KBP.motes($('motes'), 16);

		// N'écrit le HTML que s'il a changé : une mise à jour à chaud ne recrée pas les nœuds, donc ne rejoue pas leurs animations
		const setHTML = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };
		const same = (a, b) => a && b && (a.id && a.id === b.id || a.name === b.name);

		// Colonnes du tableau par rôle : libellé + champ affiché (+ champ numérique pour repérer la meilleure valeur)
		const ROLE_COLS = [['Win', 'winPct', 'winValue'], ['K/D', 'kd', 'kdValue'], ['ACS', 'acs', 'acsValue'], ['ADR', 'adr', 'adrValue'], ['KAST', 'kast', 'kastValue']];
		// Une meilleure valeur n'est signalée qu'entre rôles joués au moins MIN_BEST fois (1 match ne veut rien dire)
		const MIN_BEST = 2;
		const pctText = (v, d) => (v != null ? Math.round(v) + '%' : d || '–');
		// Icônes d'un rôle, par ordre de préférence : valorant-api.com (cache valorantData, n'importe quel agent de ce rôle),
		// puis celle importée de tracker.gg (son CDN ne sert pas toutes les icônes : Sentinelle répond 404).
		// Une image qui ne charge pas passe à la suivante (data-alt), sinon elle est masquée : voir l'écouteur « error » de #roles.
		const roleIcons = (r) => {
			const vapi = (Object.values((KB.rep.valorantData.value || {}).agents || {}).find((a) => a.role && a.role.toLowerCase() === r.key) || {}).roleIcon;
			return [...new Set([vapi, r.icon].filter(Boolean))];
		};
		$('roles').addEventListener('error', (e) => {
			const img = e.target;
			if (img.tagName !== 'IMG') return;
			if (img.dataset.alt) { const alt = img.dataset.alt; img.dataset.alt = ''; img.src = alt; } else img.style.visibility = 'hidden';
		}, true);
		function rolesHTML(p) {
			const rows = KBP.roleRows(p.roles);
			const cands = rows.filter((r) => r.played && (r.matchesValue || 0) >= MIN_BEST);
			const best = {};
			if (cands.length >= 2) for (const [, , num] of ROLE_COLS) best[num] = Math.max(...cands.map((r) => r[num] ?? -Infinity));
			return rows.map((r, i) => {
				const [icon, alt] = roleIcons(r);
				const cells = ROLE_COLS.map(([lbl, key, num]) => {
					const text = !r.played ? '–' : key === 'winPct' || key === 'kast' ? pctText(r[num], r[key]) : r[key] || '–';
					const top = r.played && best[num] != null && cands.includes(r) && r[num] === best[num];
					return `<div class="cell"><div class="kb-label">${lbl}</div><div class="rv${top ? ' best' : ''}" data-count="${esc(text)}">${esc(text)}</div></div>`;
				}).join('');
				const sub = r.played
					? `<b>${esc(r.matches || '0')}</b> match${(r.matchesValue || 0) > 1 ? 's' : ''}${r.timePlayed ? ` · ${esc(r.timePlayed)}` : ''} · <b>${r.share}%</b> du temps`
					: 'Pas joué cette saison';
				return `<div class="role kb-panel kb-anim kb-anim--right${r.main ? ' main' : ''}${r.played ? '' : ' off'}" style="--i:${4 + i}">
					<div class="ic">${icon ? `<img src="${esc(icon)}"${alt ? ` data-alt="${esc(alt)}"` : ''} alt="">` : ''}</div>
					<div class="who"><div class="rn">${esc(KB.roleLabel(r.key))}</div>${r.main ? '<span class="pk">Principal</span>' : ''}<div class="rs">${sub}</div></div>
					<div class="cells">${cells}</div><div class="share"><i data-w="${r.share}"></i></div></div>`;
			}).join('');
		}

		// Squelette des cartes de stats, recréé à chaque apparition (barres à 0, prêtes à se remplir)
		function buildStats() {
			$('stats').innerHTML = STATS.map(([lbl], i) => `<div class="stat kb-panel kb-anim kb-anim--right" style="--i:${4 + i}"><div class="kb-label">${lbl}</div>
				<div class="val"></div><div class="sub"></div><div class="bar"><i></i></div><div class="top"></div></div>`).join('');
		}

		// live = mise à jour d'une fiche déjà à l'écran : une valeur modifiée est recomptée brièvement, le reste ne bouge pas
		function fill(p, agentId, live, view) {
			const s = p.stats || {};
			$('content').classList.toggle('v-roles', view === 'roles');
			$('kicker').textContent = view === 'roles' ? 'Performances par rôle' : 'Stats joueur';
			if (view === 'roles') setHTML($('roles'), rolesHTML(p));
			const all = p.agents || [];
			// Ordre : agent choisi dans le panneau > agent pické sur la map en cours > plus joués
			const chosen = agentId && all.find((a) => a.id === agentId || a.name === agentId);
			const pick = KB.pickOf(p.riotId);
			const first = chosen || (pick && (all.find((a) => a.name === pick.name) || pick)) || all[0];
			const agents = first ? [first, ...all.filter((a) => !same(a, first))].slice(0, 3) : [];
			document.documentElement.style.setProperty('--team', KB.teamColor(p.team));

			// Photo standing ou emblème estompé (logo d'équipe / monogramme / logo KB)
			$('photoBox').style.display = p.photo ? 'block' : 'none';
			if (p.photo && $('photo').getAttribute('src') !== p.photo) $('photo').src = p.photo;
			$('emblem').style.display = p.photo ? 'none' : 'grid';
			setHTML($('emblem'), p.photo ? '' : (p.team ? KB.teamLogo(p.team, 500) : `<img src="${KB.img.kbs}" alt="">`));

			setHTML($('agents'), agents.map((a, i) => {
				const isPick = pick && a.name === pick.name;
				const sub = a.matches ? `<b>${esc(a.matches)}</b> matchs${a.winPct ? ` · <b>${esc(a.winPct)}</b> win` : ''}` : esc(KB.roleLabel(a.role));
				return `<div class="ag a${i}" style="--c:${a.color ? esc(a.color) : 'var(--kb-blue)'}"><div class="in">
					${a.portrait ? `<img src="${esc(a.portrait)}" alt="">` : ''}
					<div class="tag">${isPick ? '<div class="pk">Sur cette map</div>' : ''}<div class="n">${esc(a.name)}</div>${sub ? `<div class="s">${sub}</div>` : ''}</div>
				</div></div>`;
			}).join(''));

			$('season').textContent = (p.season || '').replace(/\s+/g, ' ').replace(/competitive/i, '· Compétitif');
			setHTML($('name'), `${esc(p.name)}${p.tag ? `<small>#${esc(p.tag)}</small>` : ''}<span class="sheen"></span>`);
			$('real').textContent = p.realName || '';

			setHTML($('teamRow'), p.team
				? KB.teamLogo(p.team, 62) + `<span class="tn">${esc(p.team.name)}</span>` + (p.role ? `<span class="kb-pill kb-pill--blue">${esc(KB.roleLabel(p.role))}</span>` : '')
				: '<span class="kb-label">Agent libre</span>');

			const rk = (lbl, r, sub, fallback) => `<div class="rank kb-panel">${r && r.icon ? `<img src="${esc(r.icon)}" alt="">` : ''}<div><div class="kb-label">${lbl}</div><div class="val">${esc((r && r.name) || fallback)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div></div>`;
			setHTML($('ranks'), rk('Rang actuel', p.rank, '', 'Non classé') + rk('Peak', p.peak, p.peak && p.peak.act, '–'));

			const wins = s.wins && s.wins.value != null ? Math.round(s.wins.value) : null;
			const losses = s.losses && s.losses.value != null ? Math.round(s.losses.value) : null;
			KB.$$('.stat', $('stats')).forEach((card, i) => {
				const st = s[STATS[i][1]];
				const pc = st && st.percentile;
				const val = KB.$('.val', card), text = v(st);
				if (val.dataset.count !== text) {
					val.dataset.count = text;
					if (live) KB.countUp(val, text, { delay: 0, duration: 400 });
					else val.textContent = text;
				}
				KB.$('.sub', card).textContent = i === 5 && wins != null ? `${wins}V – ${losses ?? 0}D` : '';
				KB.$('.bar i', card).dataset.w = pc ?? 0;
				KB.$('.top', card).textContent = pc != null && pc >= 50 ? `TOP ${Math.max(1, Math.round(100 - pc))}%` : '';
			});
		}

		const fitName = () => KB.fit($('name'), { max: 140, min: 64, step: 4, width: $('content').clientWidth });
		// Requêtes limitées à la colonne affichée : pendant un changement de vue, sa copie figée (.vx-old) porte les mêmes id
		const fillBars = () => KB.$$('.bar i, .share i', $('content')).forEach((i) => { i.style.width = i.dataset.w + '%'; });
		const countValues = (view, delay, duration) => KB.$$(view === 'roles' ? '.rv' : '.stat .val', $('content'))
			.forEach((el) => { if (el.dataset.count !== '–') KB.countUp(el, el.dataset.count, { delay, duration }); });

		// ---------- Changement de vue à l'antenne (même joueur, même agent) : la nouvelle vue recouvre l'ancienne ----------
		const VX_MS = 700; // durée des animations vxIn / vxOut / vxSeam (CSS)
		let vx = null;     // changement en cours { old, seam, timer }
		function endSwitch() {
			if (!vx) return;
			clearTimeout(vx.timer);
			vx.old.remove();
			vx.seam.remove();
			$('content').classList.remove('vx-new');
			vx = null;
		}
		function switchView(p, agentId, view) {
			endSwitch();
			const content = $('content');
			// Copie figée de la vue affichée, placée APRÈS l'original (getElementById trouve toujours l'original)
			const old = content.cloneNode(true);
			old.classList.add('vx-old', 'kb-settled');
			old.setAttribute('aria-hidden', 'true');
			content.after(old);
			// Nouvelle vue : visible d'emblée (kb-settled, pas de cascade), sinon le fond apparaîtrait sous le volet
			content.classList.add('kb-settled');
			buildStats();
			$('roles')._h = null;
			fill(p, agentId, false, view);
			fitName();
			content.classList.remove('vx-new');
			void content.offsetWidth; // relance l'animation si un changement précédent vient d'être interrompu
			content.classList.add('vx-new');
			const seam = document.createElement('div');
			seam.className = 'vx-seam';
			$('scene').appendChild(seam);
			vx = { old, seam, timer: setTimeout(endSwitch, VX_MS + 50) };
			countValues(view, 250, 800);
			requestAnimationFrame(() => requestAnimationFrame(fillBars));
		}

		function display(p, agentId, view) {
			endSwitch();
			$('content').classList.remove('kb-settled');
			buildStats();
			// Tableau par rôle recréé à chaque apparition : ses lignes rejouent leur entrée, ses barres repartent de 0
			$('roles')._h = null;
			fill(p, agentId, false, view);
			presence.show();
			fitName();
			countValues(view, 650, 1100);
			requestAnimationFrame(() => requestAnimationFrame(fillBars));
		}

		let shown = null, swapTimer = null; // shown = { card: 'joueur|agent', view } de la fiche à l'écran
		function update() {
			const g = graphic.value || {};
			const p = g.playerId ? KB.player(g.playerId) : null;
			clearTimeout(swapTimer);
			if (!g.visible || !p) { shown = null; endSwitch(); presence.hide(); return; }
			const view = KBP.view(g);
			const card = `${p.key}|${g.agentId}`;
			if (presence.visible && shown && shown.card === card) {
				// Même fiche, autre vue : la nouvelle vue recouvre l'ancienne, sans faire sortir la fiche
				if (shown.view !== view) { shown.view = view; switchView(p, g.agentId, view); return; }
				// Même joueur déjà à l'écran (score du match, données, photo modifiés) : mise à jour en place, sans rejouer l'entrée
				fill(p, g.agentId, true, view); fitName(); fillBars(); return;
			}
			const swap = presence.visible;
			shown = { card, view };
			endSwitch();
			if (swap) { presence.hide(); swapTimer = setTimeout(() => display(p, g.agentId, view), 520); }
			else display(p, g.agentId, view);
		}

		KB.watch(['playerProfiles', 'playerData', 'teams', 'match', 'valorantData', graphic], update);
	</script>
</body>
</html>
