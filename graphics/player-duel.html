<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>Face à face joueurs</title>
	<!--
		Duel plein écran entre deux joueurs : visuels de chaque côté, stats comparées au centre (KBP.DUEL_STATS, via KB.player).
		Replicants lus : playerDuel (défaut : KBP.DUEL_DEFAULT, shared/player.js), playerProfiles, playerData, teams, match (phase,
		agent pické), valorantData. Piloté par le panneau Stats Joueur (dashboard/player-stats.html).
	-->
	<link rel="stylesheet" href="../shared/theme.css">
	<style>
		#scene { position: absolute; inset: 0; visibility: hidden; opacity: 0; }
		#scene.kb-in { animation: sceneIn .5s var(--kb-ease-out) forwards; }
		#scene.kb-out { animation: sceneOut .4s ease forwards; }
		@keyframes sceneIn { to { opacity: 1; } }
		@keyframes sceneOut { from { opacity: 1; } to { opacity: 0; } }
		@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
		@keyframes breathe { 0%, 100% { transform: scale(1); opacity: .45; } 50% { transform: scale(1.08); opacity: .6; } }

		/* Particules d'ambiance */
		#motes { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
		#motes i { position: absolute; bottom: -20px; border-radius: 50%; background: var(--kb-blue-hi); box-shadow: 0 0 10px var(--kb-blue-hi); opacity: 0; animation: mote linear infinite; }
		@keyframes mote { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .7; } 85% { opacity: .5; } 100% { transform: translateY(-900px) translateX(40px); opacity: 0; } }

		/* ---------- Côtés ---------- */
		.side { position: absolute; top: 0; bottom: 0; width: 760px; overflow: hidden; --c: var(--kb-blue); --c-rgb: var(--kb-blue-rgb); }
		.side.left { left: 0; --c: var(--team-a); --c-rgb: var(--team-a-rgb); }
		.side.right { right: 0; --c: var(--team-b); --c-rgb: var(--team-b-rgb); }
		.side .wash { position: absolute; inset: 0; opacity: .55; }
		.side.left .wash { background: linear-gradient(90deg, rgba(var(--c-rgb), .45), transparent 85%); }
		.side.right .wash { background: linear-gradient(270deg, rgba(var(--c-rgb), .45), transparent 85%); }
		.side .band { position: absolute; top: -100px; width: 150px; height: 1300px; overflow: hidden; background: linear-gradient(180deg, transparent, var(--c) 30%, var(--c) 70%, transparent); opacity: .45; }
		.side .band::after { content: ''; position: absolute; left: 0; right: 0; height: 300px; top: -320px; background: linear-gradient(180deg, transparent, rgba(255, 255, 255, .55), transparent); animation: sweepY 6s ease-in-out 1.5s infinite; }
		.side.right .band::after { animation-delay: 4.5s; }
		@keyframes sweepY { 0% { transform: none; } 50%, 100% { transform: translateY(1720px); } }
		.side.left .band { left: 470px; transform: skewX(-14deg); }
		.side.right .band { right: 470px; transform: skewX(14deg); }
		/* Lueur : disque de 560 px adouci sur 420 px par un masque en dégradé (même rendu qu'un flou de 140 px, sans filter: blur,
		   coûteux sous OBS) ; la boîte de 1400 px a le même centre que le disque. */
		.side .glow { position: absolute; top: -220px; width: 1400px; height: 1400px; background: var(--agent, var(--c)); animation: breathe 6s ease-in-out infinite;
			-webkit-mask-image: radial-gradient(closest-side, rgba(0, 0, 0, .864), rgba(0, 0, 0, .847) 7.1%, rgba(0, 0, 0, .796) 14.3%, rgba(0, 0, 0, .711) 21.4%, rgba(0, 0, 0, .601) 28.6%, rgba(0, 0, 0, .474) 35.7%,
				rgba(0, 0, 0, .346) 42.9%, rgba(0, 0, 0, .232) 50%, rgba(0, 0, 0, .142) 57.1%, rgba(0, 0, 0, .078) 64.3%, rgba(0, 0, 0, .039) 71.4%, rgba(0, 0, 0, .017) 78.6%, rgba(0, 0, 0, .007) 85.7%, transparent); mask-image: radial-gradient(closest-side, rgba(0, 0, 0, .864), rgba(0, 0, 0, .847) 7.1%, rgba(0, 0, 0, .796) 14.3%, rgba(0, 0, 0, .711) 21.4%, rgba(0, 0, 0, .601) 28.6%, rgba(0, 0, 0, .474) 35.7%,
				rgba(0, 0, 0, .346) 42.9%, rgba(0, 0, 0, .232) 50%, rgba(0, 0, 0, .142) 57.1%, rgba(0, 0, 0, .078) 64.3%, rgba(0, 0, 0, .039) 71.4%, rgba(0, 0, 0, .017) 78.6%, rgba(0, 0, 0, .007) 85.7%, transparent); }
		.side.photo .glow { background: var(--c); }
		.side.left .glow { left: -360px; } .side.right .glow { right: -360px; animation-delay: -3s; }

		/* Portrait d'agent (sans photo) */
		.side .portrait { position: absolute; top: 20px; width: 900px; height: 900px; object-fit: cover; object-position: top center; filter: drop-shadow(0 20px 40px rgba(0, 0, 0, .7)); }
		.side.left .portrait { left: -150px; }
		.side.right .portrait { right: -150px; transform: scaleX(-1); }
		/* Avec photo : l'agent passe en fond (assombri), la photo standing devant */
		.side .portrait.back { top: 60px; width: 640px; height: 640px; opacity: .35; filter: blur(2px) brightness(.8); }
		.side.left .portrait.back { left: -40px; } .side.right .portrait.back { right: -40px; }
		.side .pbox { position: absolute; bottom: 210px; width: 0; height: 0; }
		.side.left .pbox { left: 330px; } .side.right .pbox { left: 430px; }
		.side .pfloat { position: absolute; inset: 0; animation: float 7s ease-in-out 1.8s infinite; }
		.side.right .pfloat { animation-delay: 3.2s; }
		.side .photo-img { position: absolute; left: 0; bottom: 0; height: 780px; width: auto; max-width: none; transform: translateX(-50%);
			-webkit-mask-image: linear-gradient(180deg, #000 72%, transparent 98%); mask-image: linear-gradient(180deg, #000 72%, transparent 98%); filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .55)); }
		.side.right .photo-img { transform: translateX(-50%) scaleX(-1); }
		.side .ghost { position: absolute; bottom: 230px; font: 220px/0.8 var(--kb-display); color: transparent; -webkit-text-stroke: 2px rgba(94, 196, 255, .12); text-transform: uppercase; white-space: nowrap; }
		.side.left .ghost { left: 40px; } .side.right .ghost { right: 40px; }
		.side .silhouette { position: absolute; top: 230px; width: 380px; height: 520px; display: grid; place-items: center; font: 400 260px/1 var(--kb-display); color: rgba(94, 196, 255, .14); }
		.side.left .silhouette { left: 120px; } .side.right .silhouette { right: 120px; }
		/* Entrées cinématiques */
		#scene.kb-in .side.left .pz { animation: kb-from-left 1s var(--kb-ease-out) .15s both; }
		#scene.kb-in .side.right .pz { animation: kb-from-right 1s var(--kb-ease-out) .15s both; }
		#scene.kb-in .side .pbox { animation: photoIn 1.3s var(--kb-ease-out) .35s both; }
		#scene.kb-in .side.right .pbox { animation-delay: .5s; }
		@keyframes photoIn { from { opacity: 0; transform: translateY(70px) scale(1.12); filter: blur(12px) brightness(2); } to { opacity: 1; transform: none; filter: none; } }

		/* Carte d'identité en bas de chaque côté */
		.card { position: absolute; bottom: 64px; width: 500px; padding: 22px 28px 20px; }
		.side.left .card { left: 64px; border-left: 6px solid var(--c); }
		.side.right .card { right: 64px; border-right: 6px solid var(--c); text-align: right; }
		.card .team { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
		.side.right .card .team { flex-direction: row-reverse; }
		.card .team .tn { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 400 28px/1.1 var(--kb-display); text-transform: uppercase; }
		.card .team > :not(.tn) { flex: 0 0 auto; }
		.card .team .kb-pill { padding: 3px 14px; font-size: 13px; }
		.card .nm { margin-top: 8px; font: 400 92px/0.95 var(--kb-display); text-transform: uppercase; white-space: nowrap; }
		.card .nm small { font-size: .34em; color: var(--kb-muted); margin-left: 8px; }
		.card .meta { display: flex; align-items: center; gap: 12px; margin-top: 10px; font: 700 22px var(--kb-num); letter-spacing: .06em; color: var(--kb-muted); text-transform: uppercase; white-space: nowrap; }
		.side.right .card .meta { flex-direction: row-reverse; }
		.card .meta img { width: 40px; height: 40px; }
		.card .meta b { color: var(--kb-text); font-weight: 700; }
		.card .meta .agent { color: var(--agent, var(--kb-blue-hi)); }

		/* ---------- Centre ---------- */
		#center { position: absolute; left: 596px; right: 596px; top: 56px; bottom: 64px; display: flex; flex-direction: column; align-items: center; z-index: 2; }
		#head { text-align: center; }
		#head .lg { position: relative; width: 112px; height: 112px; margin: 0 auto 24px; border-radius: 50%; overflow: hidden; }
		#head .lg img { width: 112px; height: 112px; }
		#head .lg::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -110%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .45), transparent); transform: skewX(-20deg); animation: kb-sweep 5s ease-in-out 2.5s infinite; }
		#head .kb-kicker { margin-top: 8px; white-space: nowrap; }
		#head .title { font: 400 76px/1 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; margin-top: 4px; }
		#head .title span { color: var(--kb-gold-hi); margin: 0 14px; display: inline-block; animation: pulseDot 2.4s ease-in-out infinite; }
		#head .title span + span { animation-delay: 1.2s; }
		@keyframes pulseDot { 0%, 100% { opacity: .6; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.15); } }
		#head .kb-rule { position: relative; overflow: hidden; width: 520px; margin: 14px auto 0; }
		#head .kb-rule::after { content: ''; position: absolute; top: 0; bottom: 0; width: 100px; left: -120px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: sweepX 5s ease-in-out 2s infinite; }
		/* Filet de 520 px : le reflet va de -120 px à 110 % du filet */
		@keyframes sweepX { 0% { transform: none; } 40%, 100% { transform: translateX(692px); } }

		#tally { display: flex; align-items: center; gap: 22px; margin-top: 16px; font: 600 14px var(--kb-ui); letter-spacing: .24em; color: var(--kb-muted); text-transform: uppercase; }
		#tally b { font: 400 48px/1 var(--kb-display); color: var(--kb-text); letter-spacing: 0; }
		#tally b.lead { color: var(--kb-gold-hi); text-shadow: 0 0 18px rgba(245, 196, 69, .5); }

		#rows { width: 100%; margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
		.row { display: grid; grid-template-columns: 124px 1fr 168px 1fr 124px; align-items: center; height: 72px; padding: 0 16px; }
		.row .lbl { text-align: center; font: 700 15px var(--kb-ui); letter-spacing: .12em; color: var(--kb-gold); text-transform: uppercase; white-space: nowrap; }
		.row .val { font: 400 38px/1 var(--kb-display); white-space: nowrap; transition: color .4s; color: var(--kb-muted); }
		.row .val.l { text-align: left; } .row .val.r { text-align: right; }
		.row .bar { height: 12px; background: rgba(140, 170, 255, .1); display: flex; }
		.row .bar.l { justify-content: flex-end; }
		.row .bar i { display: block; height: 100%; width: 0; transition: width 1.1s var(--kb-ease-out), opacity .4s; opacity: .4; }
		.row .bar.l i { background: linear-gradient(270deg, var(--team-a), rgba(var(--team-a-rgb), .5)); }
		.row .bar.r i { background: linear-gradient(90deg, var(--team-b), rgba(var(--team-b-rgb), .5)); }
		.row .best { color: var(--kb-text); }
		.row .val.best { text-shadow: 0 0 18px var(--glow); }
		.row .val.l.best { --glow: var(--team-a); } .row .val.r.best { --glow: var(--team-b); }
		.row .bar i.best { opacity: 1; box-shadow: 0 0 14px var(--glow); }
		.row .bar.l i.best { --glow: var(--team-a); } .row .bar.r i.best { --glow: var(--team-b); }

		#foot { margin-top: auto; font: 600 13px var(--kb-ui); letter-spacing: .22em; color: var(--kb-muted); text-transform: uppercase; text-align: center; }
	</style>
</head>
<body>
	<div id="scene">
		<div class="kb-bg"><div class="kb-bg__art"></div><div class="kb-bg__stars"></div><div class="kb-bg__grid"></div></div>
		<div class="side left" id="L"></div>
		<div class="side right" id="R"></div>
		<div id="motes"></div>
		<div class="kb-frame"></div>

		<div id="center">
			<div id="head" class="kb-anim kb-anim--pop" style="--i:0">
				<div class="lg"><img class="kb-logo" id="logo" alt=""></div>
				<div class="kb-kicker" id="stage"></div>
				<div class="title">Face<span>·</span>à<span>·</span>face</div>
				<div class="kb-rule kb-rule--gold"></div>
			</div>
			<div id="tally" class="kb-anim" style="--i:2"></div>
			<div id="rows"></div>
			<div id="foot" class="kb-anim" style="--i:12">Stats compétitives · saison en cours</div>
		</div>
	</div>

	<script src="../shared/kb.js"></script>
	<script src="../shared/player.js"></script>
	<script>
		// Couleur par défaut du joueur de droite : or, et non le rouge de l'équipe B (réservé aux défaites / LIVE / bans).
		// Si les deux côtés ont la même couleur, la droite passe à l'autre teinte.
		const RIGHT_COLOR = '#c9b274', RIGHT_ALT = '#5ec4ff';

		const duel = nodecg.Replicant('playerDuel', { defaultValue: KB.clone(KBP.DUEL_DEFAULT) });
		const $ = (id) => document.getElementById(id);
		const esc = KB.esc;
		const presence = KB.presence($('scene'), 420);
		$('logo').src = KB.img.kbs;
		KBP.motes($('motes'), 14, { spread: 149, lag: 1.9 });

		// N'écrit le HTML que s'il a changé : une mise à jour à chaud ne recrée pas les nœuds, donc ne rejoue pas leurs animations
		const setHTML = (el, html) => { if (el._h !== html) { el._h = html; el.innerHTML = html; } };

		// Fiche fusionnée (tracker + saisie manuelle) ; agent = pické sur la map en cours, sinon le plus joué
		function sideData(riotId) {
			const p = riotId ? KB.player(riotId) : null;
			const pick = riotId ? KB.pickOf(riotId) : null;
			const agent = (pick && ((p && p.agents.find((a) => a.name === pick.name)) || pick)) || (p && p.agents[0]) || null;
			const hasStats = !!(p && Object.values(p.stats || {}).some((s) => s && s.value != null));
			return { riotId, p, agent, hasStats };
		}

		function renderSide(el, d, side) {
			const p = d.p;
			if (!el.firstChild) {
				el.innerHTML = `<div class="wash"></div><div class="band"></div>
					<div class="card kb-panel kb-anim ${side === 'left' ? 'kb-anim--left' : 'kb-anim--right'}" style="--i:3"><div class="team"></div><div class="nm"></div><div class="meta"></div></div>`;
			}
			el.style.setProperty('--agent', (d.agent && d.agent.color) || 'var(--c)');

			// Visuel (portrait d'agent, photo) : recréé seulement si le joueur, sa photo ou son agent changent
			const visualKey = JSON.stringify([p && p.key, p && p.photo, d.agent && d.agent.name, d.agent && d.agent.portrait]);
			if (el._visualKey !== visualKey) {
				el._visualKey = visualKey;
				el.classList.toggle('photo', !!(p && p.photo));
				let visual, photo = '';
				if (p && p.photo) {
					// Agent en fond, photo standing devant (ancrée en bas, fondue)
					visual = d.agent && d.agent.portrait ? `<img class="portrait back" src="${esc(d.agent.portrait)}" alt="">` : '';
					photo = `<div class="pbox"><div class="pfloat"><img class="photo-img" src="${esc(p.photo)}" alt=""></div></div>`;
				} else if (d.agent && d.agent.portrait) {
					visual = `<div class="ghost">${esc(d.agent.name)}</div><img class="portrait" src="${esc(d.agent.portrait)}" alt="">`;
				} else {
					visual = '<div class="silhouette">?</div>';
				}
				KB.$$('.pz, .pbox', el).forEach((n) => n.remove());
				KB.$('.card', el).insertAdjacentHTML('beforebegin', `<div class="pz"><div class="glow"></div>${visual}</div>${photo}`);
			}

			// Carte d'identité : mise à jour en place
			const meta = [];
			if (p && p.rank) meta.push(`${p.rank.icon ? `<img src="${esc(p.rank.icon)}" alt="">` : ''}<b>${esc(p.rank.name)}</b>`);
			if (d.agent) meta.push(`<span class="agent">${esc(d.agent.name)}</span>`);
			if (p && !d.hasStats) meta.push('<span>Stats indisponibles</span>');
			setHTML(KB.$('.team', el), p && p.team
				? `${KB.teamLogo(p.team, 46)}<span class="tn">${esc(p.team.name)}</span>${p.role ? `<span class="kb-pill kb-pill--blue">${esc(KB.roleLabel(p.role))}</span>` : ''}`
				: `<span class="kb-label">${p ? 'Agent libre' : 'Joueur'}</span>`);
			setHTML(KB.$('.nm', el), p ? `${esc(p.name)}${p.tag ? `<small>#${esc(p.tag)}</small>` : ''}` : 'À définir');
			setHTML(KB.$('.meta', el), meta.join('<span>·</span>'));
			KB.fit(KB.$('.nm', el), { max: 92, min: 44, step: 4, width: 444 });
		}

		function statOf(d, key) {
			const s = d.p && d.p.stats && d.p.stats[key];
			return s && s.value != null ? { v: s.value, display: s.display || String(s.value) } : null;
		}

		// Lignes de comparaison, recréées à chaque apparition (barres à 0, prêtes à se remplir)
		let barsOn = false, barsTimer = null;
		function buildRows() {
			$('rows').innerHTML = KBP.DUEL_STATS.map((st, i) => `<div class="row kb-panel kb-anim" style="--i:${4 + i}">
				<div class="val l"></div><div class="bar l"><i></i></div><div class="lbl">${esc(st.label)}</div><div class="bar r"><i></i></div><div class="val r"></div>
			</div>`).join('');
			barsOn = false;
		}

		// live = duel déjà à l'écran : une valeur modifiée est recomptée brièvement, les barres glissent vers leur nouvelle largeur
		function setVal(el, text, best, live) {
			el.classList.toggle('best', !!best);
			if (el.dataset.count === text) return;
			el.dataset.count = text;
			if (live) KB.countUp(el, text, { delay: 0, duration: 400 });
			else el.textContent = text;
		}
		function setBar(el, w, best) {
			el.classList.toggle('best', !!best);
			el.dataset.w = w;
			if (barsOn) el.style.width = w + '%';
		}

		function render(live) {
			const g = duel.value || {};
			const L = sideData(g.left), R = sideData(g.right);
			// Couleurs : équipe de chaque joueur, sinon couleurs par défaut (voir RIGHT_COLOR)
			const ca = KB.teamColor(L.p && L.p.team);
			let cb = (R.p && R.p.team && R.p.team.color) || RIGHT_COLOR;
			if (cb.toLowerCase() === ca.toLowerCase()) cb = ca.toLowerCase() === RIGHT_COLOR ? RIGHT_ALT : RIGHT_COLOR;
			KB.setColor(document.documentElement, 'team-a', ca);
			KB.setColor(document.documentElement, 'team-b', cb);

			const m = KB.rep.match.value;
			$('stage').textContent = (m && m.stage) || 'KB Series';
			renderSide($('L'), L, 'left');
			renderSide($('R'), R, 'right');

			let wl = 0, wr = 0;
			KB.$$('#rows .row').forEach((row, i) => {
				const key = KBP.DUEL_STATS[i].key;
				const a = statOf(L, key), b = statOf(R, key);
				const max = Math.max(a ? a.v : 0, b ? b.v : 0) || 1;
				const bestL = a && (!b || a.v > b.v), bestR = b && (!a || b.v > a.v);
				if (a && b) { if (bestL) wl++; if (bestR) wr++; }
				const w = (x) => (x ? Math.max(6, Math.pow(x.v / max, 2) * 100) : 0);
				const [vl, vr] = KB.$$('.val', row), [bl, br] = KB.$$('.bar i', row);
				setVal(vl, a ? a.display : '–', bestL, live);
				setVal(vr, b ? b.display : '–', bestR, live);
				setBar(bl, w(a), bestL);
				setBar(br, w(b), bestR);
			});
			setHTML($('tally'), L.hasStats && R.hasStats
				? `<b class="${wl > wr ? 'lead' : ''}">${wl}</b><span>Stats gagnées</span><b class="${wr > wl ? 'lead' : ''}">${wr}</b>`
				: '<span>Comparaison incomplète</span>');
		}

		function animate() {
			KB.$$('#rows .val').forEach((el, i) => KB.countUp(el, el.dataset.count, { delay: 650 + Math.floor(i / 2) * 70, duration: 1000 }));
			clearTimeout(barsTimer);
			barsTimer = setTimeout(() => { barsOn = true; KB.$$('#rows .bar i').forEach((i) => { i.style.width = i.dataset.w + '%'; }); }, 700);
		}

		let shownKey = null, timer = null;
		function update() {
			const g = duel.value || {};
			clearTimeout(timer);
			if (!g.visible || (!g.left && !g.right)) { shownKey = null; presence.hide(); return; }
			const key = [KB.key(g.left), KB.key(g.right)].join('|');
			// Mêmes joueurs déjà à l'écran : mise à jour en place, sans rejouer l'entrée
			if (presence.visible && key === shownKey) { render(true); return; }
			const swap = presence.visible;
			shownKey = key;
			const go = () => { buildRows(); render(false); presence.show(); animate(); };
			if (swap) { presence.hide(); timer = setTimeout(go, 460); } else go();
		}

		KB.watch(['playerProfiles', 'playerData', 'teams', 'match', 'valorantData', duel], update);
	</script>
</body>
</html>
