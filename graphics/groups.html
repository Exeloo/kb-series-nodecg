<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>Groupes — Classement</title>
	<!--
		Classement plein écran des groupes (V-D, rounds, différence), qualifiés en or ; les changements de score sont animés en place.
		Replicants lus : bracket (groupes, nombre de qualifiés), bracketGraphics.groups.visible (défaut : KBB.GRAPHICS_DEFAULT,
		shared/bracket.js), teams. Piloté par le panneau Bracket & Groupes (dashboard/bracket.html).
	-->
	<link rel="stylesheet" href="../shared/theme.css">
	<style>
		/* Affichage géré par KB.scene : .kb-in / .kb-out, puis .kb-settled une fois les entrées jouées */
		#root { position: absolute; inset: 0; visibility: hidden; }
		.fade { opacity: 0; }
		.kb-in .fade { animation: gp-fade .6s ease forwards; animation-delay: var(--d, 0s); }
		.kb-out .fade { animation: kb-fade-out .4s ease forwards !important; }
		.kb-settled .kb-anim, .kb-settled .fade { animation: none !important; opacity: 1 !important; }
		@keyframes gp-fade { to { opacity: 1; } }
		.kb-bg__art { opacity: .32; animation: gp-drift 40s ease-in-out infinite alternate; }
		@keyframes gp-drift { from { transform: scale(1.02); } to { transform: scale(1.07) translate(12px, -8px); } }

		/* ---------- En-tête : bloc identique dans groups.html et bracket.html (garder les deux alignés) ---------- */
		#head { position: absolute; left: 96px; right: 96px; top: 58px; height: 120px; display: flex; align-items: center; gap: 28px; }
		#head .logoWrap { position: relative; width: 116px; height: 116px; flex: 0 0 auto; }
		#head .logoWrap img { width: 116px; height: 116px; }
		#head .logoWrap::after { content: ''; position: absolute; inset: -10px; border-radius: 50%; background: radial-gradient(circle, rgba(245, 196, 69, .28), transparent 65%); animation: head-breathe 5s ease-in-out infinite; z-index: -1; }
		@keyframes head-breathe { 0%, 100% { opacity: .5; transform: scale(.92); } 50% { opacity: 1; transform: scale(1.06); } }
		#head .txt { display: flex; flex-direction: column; gap: 6px; }
		#head .kb-title { font-size: 78px; }
		#headRule { position: absolute; left: 96px; right: 96px; top: 190px; overflow: hidden; }
		.kb-in #headRule { animation: head-grow .9s var(--kb-ease-out) .3s both; }
		.kb-settled #headRule { animation: none; }
		.kb-out #headRule { animation: kb-fade-out .4s ease forwards; }
		#headRule::after { content: ''; position: absolute; top: -4px; bottom: -4px; width: 220px; left: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .95), transparent); opacity: .8; transform: translateX(-260px); animation: head-sweep 7s ease-in-out 3s infinite; }
		@keyframes head-sweep { 0% { transform: translateX(-260px); } 45%, 100% { transform: translateX(1990px); } }
		@keyframes head-grow { from { transform: scaleX(0); opacity: 0; } to { transform: none; opacity: 1; } }
		/* Partie droite de l'en-tête : pictogramme + pastille */
		#head .right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
		#head .icon { width: 120px; height: 72px; filter: drop-shadow(0 0 14px rgba(245, 196, 69, .35)); }
		#head .icon .mid { animation: gp-bob 4s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom; }
		@keyframes gp-bob { 0%, 100% { transform: none; } 50% { transform: translateY(-2px) scale(1.03); } }
		#head .kb-pill { position: relative; overflow: hidden; }
		#head .kb-pill::after { content: ''; position: absolute; top: 0; bottom: 0; width: 50px; left: -70px; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .7), transparent); transform: skewX(-20deg); animation: gp-pill 6s ease-in-out 3s infinite; }
		/* Reflet sur toute la largeur de la pastille (position en %), quel que soit son texte */
		@keyframes gp-pill { 0% { left: -70px; } 30%, 100% { left: calc(100% + 20px); } }

		/* ---------- Groupes ---------- */
		#board { position: absolute; left: 96px; right: 96px; top: 222px; bottom: 120px; display: grid; gap: 28px 48px; align-content: center; }
		.group { position: relative; display: flex; flex-direction: column; }
		.ghead { position: relative; display: flex; align-items: flex-end; gap: 16px; padding: 0 6px 12px 2px; }
		.ghead::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: linear-gradient(90deg, var(--kb-gold-hi), var(--kb-gold) 30%, var(--kb-gold-dim) 65%, transparent); transform-origin: left; }
		.kb-in .ghead::after { animation: head-grow .8s var(--kb-ease-out) both; animation-delay: calc(var(--d) + .15s); }
		.kb-settled .ghead::after { animation: none; }
		.ghead .gname { font: 400 var(--gfs, 46px)/1 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; }
		.ghead .q { margin-left: auto; font: 600 15px var(--kb-ui); letter-spacing: .24em; text-transform: uppercase; color: var(--kb-gold); padding-bottom: 4px; }
		.cols, .grow { display: grid; grid-template-columns: var(--rkw, 64px) 1fr 120px 150px 110px; align-items: center; }
		.narrow .cols, .narrow .grow { grid-template-columns: 52px 1fr 76px 86px 64px; }
		.narrow { --rkw: 52px; }
		.cols { padding: 10px 0 8px; font: 600 14px var(--kb-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--kb-muted); }
		.cols span:nth-child(n+3), .grow > :nth-child(n+3) { text-align: center; }
		.cols span:nth-child(2) { padding-left: 16px; }

		.grows { position: relative; display: flex; flex-direction: column; gap: 6px; }
		.grow { --tc: var(--kb-blue); position: relative; height: var(--rh, 84px); background: linear-gradient(90deg, rgba(27, 35, 102, .88), rgba(10, 15, 46, .9)); border: 1px solid rgba(94, 196, 255, .2);
			clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%); transition: opacity .6s, border-color .6s; }
		.grow .rk { position: relative; align-self: stretch; display: grid; place-items: center; font: 400 calc(var(--rh, 84px) * .46)/1 var(--kb-display); color: var(--kb-muted); background: rgba(255, 255, 255, .04); border-right: 1px solid rgba(94, 196, 255, .15); overflow: hidden; transition: color .5s; }
		.grow .rk::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, var(--kb-gold-hi), var(--kb-gold)); transform: scaleY(0); transform-origin: bottom; transition: transform .55s var(--kb-ease-out); }
		.grow .rk b { position: relative; font-weight: 400; }
		.grow .team { display: flex; align-items: center; gap: 16px; min-width: 0; padding-left: 16px; }
		.grow .team .lg { flex: 0 0 auto; display: grid; place-items: center; }
		.grow .team .nm { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
		.grow .team .n { font: 700 calc(var(--rh, 84px) * .4)/1.05 var(--kb-num); text-transform: uppercase; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.grow .team .n.long { font-size: calc(var(--rh, 84px) * .32); }
		.grow .team .t { font: 600 13px var(--kb-ui); letter-spacing: .24em; color: var(--kb-muted); text-transform: uppercase; }
		.grow .wl { font: 400 calc(var(--rh, 84px) * .44)/1 var(--kb-display); white-space: nowrap; }
		.grow .wl .w { color: var(--kb-text); } .grow .wl .l { color: var(--kb-muted); } .grow .wl .sep { color: var(--kb-muted); margin: 0 6px; opacity: .6; }
		.grow .rd { font: 700 calc(var(--rh, 84px) * .3)/1 var(--kb-num); color: var(--kb-muted); letter-spacing: .04em; white-space: nowrap; }
		.grow .df { font: 700 calc(var(--rh, 84px) * .38)/1 var(--kb-num); white-space: nowrap; transition: color .5s; }
		.grow .df.pos { color: var(--kb-blue-hi); } .grow .df.neg { color: var(--kb-muted); } .grow .df.zero { color: var(--kb-muted); }
		.grow .wl, .grow .rd, .grow .df, .grow .rk b { display: inline-block; }
		.grow::before { content: ''; position: absolute; left: var(--rkw, 64px); top: 0; bottom: 0; width: 5px; background: var(--tc); }
		.grow .shine { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(100deg, transparent 30%, rgba(255, 230, 160, .16) 46%, rgba(255, 245, 210, .32) 50%, rgba(255, 230, 160, .16) 54%, transparent 70%); transform: translateX(-100%); }

		/* Qualifiés : or + reflet qui passe en vague */
		.grow.qual { border-color: rgba(245, 196, 69, .45); background: linear-gradient(90deg, rgba(201, 178, 116, .22), rgba(27, 35, 102, .88) 35%, rgba(10, 15, 46, .9)); }
		.grow.qual .rk { color: var(--kb-ink); border-right-color: transparent; }
		.grow.qual .rk::before { transform: none; }
		.kb-in .grow.qual .rk::before { animation: gp-fill .55s var(--kb-ease-out) both; animation-delay: var(--fd, 1s); }
		.kb-settled .grow.qual .rk::before, .kb-settled .grow .rk::before { animation: none; }
		@keyframes gp-fill { from { transform: scaleY(0); } to { transform: none; } }
		.grow.qual.first { box-shadow: inset 0 0 0 1px var(--kb-gold-hi); }
		.kb-settled .grow.qual .shine { animation: gp-shine 9s ease-in-out infinite; animation-delay: var(--sd, 0s); }
		@keyframes gp-shine { 0% { transform: translateX(-100%); } 22%, 100% { transform: translateX(100%); } }
		.grow > * { transition: opacity .6s; }
		.grow.out > :not(.flash) { opacity: .5; }
		.grow.out { border-color: rgba(94, 196, 255, .1); }
		.cutline { position: relative; height: 0; margin: 6px 0 22px; border-top: 2px dashed rgba(201, 178, 116, .5); transform-origin: right; }
		.kb-in .cutline { animation: head-grow .7s var(--kb-ease-out) both; animation-delay: var(--cd, 1.4s); }
		.kb-settled .cutline { animation: none; }
		.cutline span { position: absolute; right: 0; top: 4px; padding: 0; font: 700 12px var(--kb-ui); letter-spacing: .26em; color: var(--kb-gold); text-transform: uppercase; }
		.empty { padding: 30px 0; font: 600 18px var(--kb-ui); letter-spacing: .2em; color: var(--kb-muted); text-transform: uppercase; text-align: center; border: 1px dashed rgba(140, 170, 255, .25); }

		/* Changements de données */
		.pop { animation: gp-pop .7s var(--kb-ease-out); }
		@keyframes gp-pop { 0% { transform: scale(1); } 35% { transform: scale(1.35); color: var(--kb-gold-hi); } 100% { transform: none; } }
		.grow.appear { animation: kb-from-left .6s var(--kb-ease-out) both !important; }
		.grow .flash { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(245, 196, 69, .35), transparent 70%); opacity: 0; }
		.grow .flash.go { animation: gp-flash 1.1s ease-out; }
		@keyframes gp-flash { 0% { opacity: 1; } 100% { opacity: 0; } }

		/* ---------- Pied ---------- */
		#foot { position: absolute; left: 96px; right: 96px; bottom: 50px; display: flex; align-items: center; gap: 22px; font: 600 14px var(--kb-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--kb-muted); }
		#foot .legend { display: flex; align-items: center; gap: 12px; }
		#foot .sw { width: 18px; height: 18px; background: linear-gradient(180deg, var(--kb-gold-hi), var(--kb-gold)); clip-path: polygon(0 0, 100% 0, 100% 65%, 65% 100%, 0 100%); }
		#foot .partners { margin-left: auto; display: flex; align-items: center; gap: 22px; }
		#foot img { height: 30px; opacity: .9; }
		#foot .sep { width: 6px; height: 6px; background: var(--kb-gold); transform: rotate(45deg); }
	</style>
</head>
<body>
	<div id="root">
		<div class="kb-bg fade"><div class="kb-bg__art"></div><div class="kb-bg__grid"></div><div class="kb-bg__stars"></div></div>
		<div class="kb-frame fade" style="--d:.1s"></div>

		<div id="head">
			<div class="logoWrap kb-anim kb-anim--pop" style="--d:.1s;--i:0"><img class="kb-logo" src="../shared/img/kbs-logo.png" alt=""></div>
			<div class="txt">
				<div class="kb-kicker kb-anim kb-anim--left" style="--d:.1s;--i:1" id="kicker"></div>
				<div class="kb-title kb-anim kb-anim--left" style="--d:.1s;--i:2">Classement</div>
			</div>
			<div class="right">
				<svg class="icon kb-anim kb-anim--right" style="--d:.1s;--i:2" viewBox="0 0 100 60">
					<defs><linearGradient id="gGrp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6e7b8"/><stop offset="1" stop-color="#c9b274"/></linearGradient></defs>
					<g fill="#55566a"><circle cx="14" cy="24" r="6"/><path d="M3 54c0-12 5-19 11-19s11 7 11 19z"/><circle cx="86" cy="24" r="6"/><path d="M75 54c0-12 5-19 11-19s11 7 11 19z"/></g>
					<g fill="#e9dcae"><circle cx="31" cy="19" r="8"/><path d="M18 56c0-15 6-23 13-23s13 8 13 23z"/><circle cx="69" cy="19" r="8"/><path d="M56 56c0-15 6-23 13-23s13 8 13 23z"/></g>
					<g class="mid" fill="url(#gGrp)"><circle cx="50" cy="14" r="10"/><path d="M34 58c0-18 7-28 16-28s16 10 16 28z"/></g>
				</svg>
				<span class="kb-pill kb-anim kb-anim--right" style="--d:.1s;--i:3" id="pill"></span>
			</div>
		</div>
		<div id="headRule" class="kb-rule kb-rule--gold"></div>

		<div id="board"></div>

		<div id="foot" class="fade" style="--d:1.8s">
			<div class="legend"><span class="sw"></span><span>Qualifiés pour les quarts de finale</span></div>
			<div class="partners"><span>Présenté par</span><img src="../shared/img/cycom-alpha.png" alt=""><span class="sep"></span><img src="../shared/img/epitech-alpha.png" alt=""></div>
		</div>
	</div>

	<script src="../shared/kb.js"></script>
	<script src="../shared/bracket.js"></script>
	<script>
		// Libellés fixes de l'en-tête (aucun replicant ne les contient)
		const TEXTS = { kicker: 'Phase de groupes · Online', pill: 'Online' };

		const bracketRep = nodecg.Replicant('bracket', { defaultValue: KBB.defaultBracket() });
		const gfxRep = nodecg.Replicant('bracketGraphics', { defaultValue: KB.clone(KBB.GRAPHICS_DEFAULT) });
		const root = KB.$('#root');
		const board = KB.$('#board');
		// Entrées jouées pendant 3 s ; ensuite (.kb-settled) les changements de données sont animés : pop, reclassement, reflet
		const scene = KB.scene(root, { settleMs: 3000, outMs: 450 });
		let animateChanges = false;
		KB.$('#kicker').textContent = TEXTS.kicker;
		KB.$('#pill').textContent = TEXTS.pill;
		let layoutKey = '';
		let L = {};   // paramètres de mise en page courants

		const ROW_HTML = `<div class="rk"><b></b></div>
			<div class="team"><div class="lg"></div><div class="nm"><div class="n"></div><div class="t"></div></div></div>
			<div class="wl"><span class="w"></span><span class="sep">-</span><span class="l"></span></div>
			<div class="rd"></div><div class="df"></div><div class="shine"></div><div class="flash"></div>`;

		// Construit les panneaux de groupe (seulement quand le nombre/nom des groupes ou la mise en page change)
		function buildGroups(groups) {
			const n = Math.max(1, groups.length);
			const cols = n <= 3 ? n : n === 4 ? 2 : 3;
			const rowsOfGroups = Math.ceil(n / cols);
			const maxTeams = Math.max(1, ...groups.map((g) => ((g.teams || []).filter((t) => t && t.id)).length));
			const avail = (700 - (rowsOfGroups - 1) * 28) / rowsOfGroups - 100;
			const rh = Math.max(44, Math.min(92, Math.floor(avail / maxTeams) - 6));
			L = { cols, rh, narrow: cols >= 3 };
			board.classList.toggle('narrow', L.narrow);
			board.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
			board.style.setProperty('--rh', rh + 'px');
			board.style.setProperty('--gfs', (rowsOfGroups > 1 || L.narrow ? 36 : 46) + 'px');
			if (!groups.length) { board.innerHTML = `<div class="empty kb-anim" style="--d:.6s">Groupes à venir</div>`; return; }
			board.innerHTML = groups.map((g, gi) => `
				<div class="group" data-g="${gi}" style="--d:${(.55 + gi * .18).toFixed(2)}s">
					<div class="ghead kb-anim kb-anim--left" style="--i:0"><span class="gname">${KB.esc(g.name || 'Groupe ' + String.fromCharCode(65 + gi))}</span><span class="q"></span></div>
					<div class="cols kb-anim" style="--i:1"><span>#</span><span>Équipe</span><span>V - D</span><span>Rounds</span><span>Diff.</span></div>
					<div class="grows"></div></div>`).join('');
		}

		function setText(el, v, pop) {
			v = String(v);
			if (el.textContent === v) return;
			el.textContent = v;
			if (pop && animateChanges) KB.restart(el.closest('.wl, .rd, .df, .rk b') || el, 'pop');
		}

		function renderGroup(gEl, g, gi, qualify) {
			const grows = KB.$('.grows', gEl);
			const st = KBB.standings(g);
			KB.$('.ghead .q', gEl).textContent = qualify > 0 && qualify < st.length ? `Top ${qualify} qualifiés` : '';
			const gd = parseFloat(gEl.style.getPropertyValue('--d')) || .6;

			// Positions avant (FLIP)
			const before = new Map();
			if (animateChanges) for (const el of grows.children) before.set(el, el.offsetTop);

			const existing = new Map([...grows.querySelectorAll('.grow')].map((el) => [el.dataset.id, el]));
			const order = [];
			st.forEach((r, i) => {
				let el = existing.get(r.id);
				const isNew = !el;
				if (isNew) {
					el = document.createElement('div');
					el.className = 'grow kb-anim kb-anim--left';
					el.dataset.id = r.id;
					el.innerHTML = ROW_HTML;
					if (animateChanges) el.classList.add('appear');
				}
				existing.delete(r.id);
				const t = KB.team(r.id);
				const name = t ? t.name : String(r.id).toUpperCase();
				const q = qualify > 0 && i < qualify;
				const wasQ = el.classList.contains('qual');
				el.style.setProperty('--i', (2 + i * 1.3).toFixed(1));
				el.style.setProperty('--fd', (gd + .55 + i * .12).toFixed(2) + 's');
				el.style.setProperty('--sd', (i * .45 + gi * .25).toFixed(2) + 's');
				el.style.setProperty('--tc', KB.teamColor(t));
				el.classList.toggle('qual', q);
				el.classList.toggle('out', !q && qualify > 0);
				el.classList.toggle('first', q && i === 0);
				const sig = [name, t && t.logo, t && t.color, t && t.tag, L.rh].join('|');
				if (el.dataset.sig !== sig) {
					el.dataset.sig = sig;
					KB.$('.lg', el).innerHTML = KB.teamLogo(t || { name, tag: r.id }, Math.round(L.rh * .66));
					const n = KB.$('.n', el);
					n.textContent = name;
					n.classList.toggle('long', name.length > (L.narrow ? 14 : 20));
					KB.$('.t', el).textContent = t && t.tag && L.rh >= 64 ? t.tag : '';
				}
				const pop = !isNew;
				setText(KB.$('.rk b', el), i + 1, pop);
				setText(KB.$('.w', el), r.w, pop);
				setText(KB.$('.l', el), r.l, pop);
				setText(KB.$('.rd', el), `${r.rw}:${r.rl}`, pop);
				const df = KB.$('.df', el);
				setText(df, (r.diff > 0 ? '+' : '') + r.diff, pop);
				df.className = 'df ' + (r.diff > 0 ? 'pos' : r.diff < 0 ? 'neg' : 'zero');
				if (animateChanges && q && !wasQ && !isNew) KB.restart(KB.$('.flash', el), 'go');
				order.push(el);
			});
			for (const el of existing.values()) el.remove();

			// Ordre + ligne de qualification
			let cut = KB.$('.cutline', grows);
			const cutAt = qualify > 0 && qualify < st.length ? qualify : -1;
			if (cutAt < 0 && cut) { cut.remove(); cut = null; }
			if (cutAt >= 0 && !cut) {
				cut = document.createElement('div');
				cut.className = 'cutline';
				cut.innerHTML = '<span>Éliminés</span>';
			}
			if (cut) cut.style.setProperty('--cd', (gd + .7 + cutAt * .12).toFixed(2) + 's');
			const want = [];
			order.forEach((el, i) => { if (i === cutAt && cut) want.push(cut); want.push(el); });
			const have = [...grows.children].filter((e) => !e.classList.contains('empty'));
			// Ne déplace les nœuds que si l'ordre change (déplacer un nœud relance ses animations CSS)
			if (want.length !== have.length || want.some((e, i) => e !== have[i])) want.forEach((el) => grows.appendChild(el));
			if (!st.length) grows.innerHTML = '<div class="empty">Équipes à venir</div>';
			else KB.$$('.empty', grows).forEach((e) => e.remove());

			// FLIP : chaque ligne glisse de son ancienne position vers la nouvelle
			if (animateChanges) {
				for (const el of grows.children) {
					if (!before.has(el)) continue;
					const dy = before.get(el) - el.offsetTop;
					if (Math.abs(dy) > 1) el.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 750, easing: 'cubic-bezier(.2,.8,.2,1)' });
				}
			}
		}

		function render() {
			animateChanges = root.classList.contains('kb-settled');
			// Pendant les entrées, une ligne apparue lors d'un précédent affichage reprend l'entrée normale
			if (!animateChanges) KB.$$('.appear', board).forEach((e) => e.classList.remove('appear'));
			const bk = bracketRep.value || KBB.defaultBracket();
			const groups = (bk.groups || []).filter(Boolean);
			const maxTeams = Math.max(1, ...groups.map((g) => ((g.teams || []).filter((t) => t && t.id)).length));
			const key = JSON.stringify([groups.map((g) => g.name), maxTeams]);
			if (key !== layoutKey) { layoutKey = key; buildGroups(groups); }
			const qualify = Math.max(0, +bk.qualify || 0);
			groups.forEach((g, gi) => { const gEl = KB.$(`.group[data-g="${gi}"]`, board); if (gEl) renderGroup(gEl, g, gi, qualify); });
		}

		KB.watch(['teams', bracketRep, gfxRep], () => {
			scene.set(!!(gfxRep.value && gfxRep.value.groups && gfxRep.value.groups.visible), render);
		});
	</script>
</body>
</html>
