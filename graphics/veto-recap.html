<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>Récap du veto</title>
	<!-- Récapitulatif du veto : maps jouées dans l'ordre (pick / decider, côtés, score une fois jouée) et rappel des bans.
	     Lit match, teams, veto, valorantData et matchGraphics.vetoRecap (visibilité).
	     Piloté par le panneau « Veto » (dashboard/veto.html). -->
	<link rel="stylesheet" href="../shared/theme.css">
	<link rel="stylesheet" href="../shared/match.css">
	<style>
		/* ---------- En-tête ---------- */
		#head { position: absolute; left: 0; right: 0; top: 62px; text-align: center; }
		#head .kb-kicker { font-size: 18px; }
		#head h1 { margin: 6px 0 12px; font: 400 92px/0.95 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; }
		#rule { width: 520px; margin: 0 auto; }
		.kb-in #rule { animation: rule-in .9s var(--kb-ease-out) .45s both; }
		@keyframes rule-in { from { opacity: 0; transform: scaleX(0); } to { opacity: 1; transform: none; } }
		#matchup { margin-top: 18px; display: flex; justify-content: center; align-items: center; gap: 22px; }
		#matchup .t { display: flex; align-items: center; gap: 14px; max-width: 640px; min-width: 0; }
		#matchup .t.r { flex-direction: row-reverse; }
		#matchup .t span { padding-top: .12em; font: 400 36px/1.3 var(--kb-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		#matchup .t .bar { flex: 0 0 5px; height: 40px; background: var(--c); box-shadow: 0 0 12px var(--c); }
		#matchup .vs { font: 400 30px var(--kb-display); color: var(--kb-gold); font-style: italic; }

		/* ---------- Cartes ---------- */
		#cards { position: absolute; left: 70px; right: 70px; top: 352px; height: 520px; display: flex; justify-content: center; gap: 28px; }
		.cw { flex: 0 0 var(--w); height: 100%; }
		.card { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--kb-night-2); clip-path: polygon(28px 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%, 0 28px); }
		.card .img { position: absolute; inset: 0; background: center / cover no-repeat; filter: brightness(.8) saturate(1.05); transform: scale(1.08); }
		.kb-in .card .img { animation: img-in 1.6s var(--kb-ease-out) both, img-drift 18s ease-in-out 1.6s infinite alternate; animation-delay: calc(.3s + var(--i) * 120ms), calc(1.6s + var(--i) * 120ms); }
		@keyframes img-in { from { transform: scale(1.25); filter: brightness(.2) saturate(.5); } to { transform: scale(1.08); } }
		@keyframes img-drift { from { transform: scale(1.08) translateX(-12px); } to { transform: scale(1.12) translateX(12px); } }
		.card .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(4, 6, 26, .55) 0%, rgba(4, 6, 26, .15) 30%, rgba(4, 6, 26, .75) 58%, rgba(4, 6, 26, .97) 100%); }
		.card .edge { position: absolute; inset: 0; border: 3px solid var(--c); opacity: .9; pointer-events: none; }
		.card.decider .edge { border-color: var(--kb-gold-hi); }
		.card .gl { position: absolute; inset: 0; pointer-events: none; }
		.card .num { position: absolute; left: 34px; top: 22px; display: flex; align-items: baseline; gap: 10px; }
		.card .num b { font: 400 92px/1 var(--kb-display); color: transparent; -webkit-text-stroke: 2px rgba(255, 255, 255, .75); }
		.card .num span { font: 700 18px var(--kb-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--kb-gold); }
		.card .status { position: absolute; right: 26px; top: 30px; }
		.card .status .kb-pill { font-size: 14px; padding: 5px 16px; }
		.card .status .done { font: 400 34px/1 var(--kb-display); color: #fff; text-align: right; }
		.card .status .done small { display: block; font: 700 12px var(--kb-ui); letter-spacing: .2em; color: var(--kb-muted); text-transform: uppercase; margin-top: 4px; }
		.card .body { position: absolute; left: 0; right: 0; bottom: 26px; padding: 0 30px; }
		.card .mn { font: 400 84px/0.95 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-shadow: 0 4px 24px rgba(0, 0, 0, .6); }
		.card .by { margin-top: 14px; display: flex; align-items: center; gap: 12px; min-width: 0; }
		.card .by .lb { flex: 0 0 auto; padding: 3px 12px; font: 700 13px var(--kb-ui); letter-spacing: .24em; text-transform: uppercase; background: var(--c); color: #04061a; }
		.card.decider .by .lb { background: linear-gradient(180deg, #ffe08a, var(--kb-gold-hi)); color: var(--kb-ink); }
		.card .by .tn { font: 400 30px/1.1 var(--kb-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.card.decider .by .tn { color: #ffe9b0; }
		.card .sides { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
		.card .sd { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(4, 6, 26, .7); border-left: 4px solid var(--sc); min-width: 0; }
		.card .sd .k { font: 700 11px var(--kb-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--sc); }
		.card .sd .v { font: 400 24px/1.05 var(--kb-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.card .sd > div { min-width: 0; }
		.card .sd.atk { --sc: var(--kb-orange); }
		.card .sd.def { --sc: var(--kb-blue-hi); }
		.card .wait { margin-top: 16px; font: 600 15px var(--kb-ui); letter-spacing: .16em; text-transform: uppercase; color: var(--kb-gold); animation: pulse 1.4s ease-in-out infinite; }
		@keyframes pulse { 50% { opacity: .5; } }
		.card.narrow .mn { font-size: 60px; }
		.card.narrow .sides { grid-template-columns: 1fr; }
		.card.narrow .num b { font-size: 72px; }
		.card.changed { animation: card-bump .7s var(--kb-ease-out); }
		@keyframes card-bump { 0% { transform: scale(1.04); filter: brightness(1.6); } 100% { transform: none; filter: none; } }
		#empty { position: absolute; left: 0; right: 0; top: 560px; text-align: center; font: 600 24px var(--kb-ui); letter-spacing: .25em; text-transform: uppercase; color: var(--kb-muted); display: none; }

		/* ---------- Bans (rappel discret) ---------- */
		#bans { position: absolute; left: 0; right: 0; top: 906px; display: flex; justify-content: center; align-items: center; gap: 26px; }
		#bans .lbl { font: 700 14px var(--kb-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--kb-muted); }
		#bans .b { display: flex; align-items: center; gap: 10px; opacity: .75; }
		#bans .b span { position: relative; font: 400 26px/1 var(--kb-display); text-transform: uppercase; color: rgba(243, 241, 234, .6); }
		#bans .b span::after { content: ''; position: absolute; left: -4px; right: -4px; top: 50%; height: 2px; background: var(--kb-red); opacity: .8; transform: rotate(-8deg); }

		#logoKbs { position: absolute; right: 70px; bottom: 50px; width: 110px; }
		#partners { position: absolute; left: 70px; bottom: 74px; display: flex; align-items: center; gap: 16px; font: 600 13px var(--kb-ui); letter-spacing: .25em; text-transform: uppercase; color: var(--kb-muted); }
		#partners img { height: 32px; }
	</style>
</head>
<body>
	<div id="stage" class="kb-scene">
		<div class="kb-bg"><div class="kb-bg__art"></div><div class="kb-bg__grid"></div><div class="kb-bg__stars"></div><div class="m-drift"></div></div>
		<div class="kb-frame"></div>

		<div id="head">
			<div class="kb-kicker kb-anim" id="kicker" style="--i:0"></div>
			<h1 class="kb-anim" style="--i:1">Ordre des maps</h1>
			<div id="rule" class="kb-rule kb-rule--gold m-sweep"></div>
			<div id="matchup" class="kb-anim" style="--i:2"></div>
		</div>

		<div id="cards"></div>
		<div id="empty">Veto en attente</div>
		<div id="bans" class="kb-anim" style="--i:10"></div>

		<div id="partners" class="kb-anim" style="--i:11"><span>Présenté par</span><img id="logoCycom" alt=""><img id="logoEpitech" alt=""></div>
		<img id="logoKbs" class="kb-logo kb-anim kb-anim--pop" style="--i:11" alt="">
	</div>

	<script src="../shared/kb.js"></script>
	<script src="../shared/match.js"></script>
	<script>
		const M = window.KBMatch;
		const esc = KB.esc;
		const gfx = M.gfx();
		const stage = KB.$('#stage');
		const scene = KB.scene(stage, { outMs: 450 });
		KB.$('#logoKbs').src = KB.img.kbs;
		KB.$('#logoCycom').src = KB.img.cycom;
		KB.$('#logoEpitech').src = KB.img.epitech;

		const teamOf = (k) => { const m = KB.rep.match.value || {}; return KB.team(k === 'A' ? m.teamA : k === 'B' ? m.teamB : null); };
		const color = (k) => KB.teamColor(teamOf(k), k);
		const mapEntry = (match, name) => (match.maps || []).find((x) => x.map === name) || null;
		const fitName = (el) => KB.fit(el, { max: el.closest('.narrow') ? 60 : 84, min: 36, wrap: false });
		const nameOf = (k) => { const t = teamOf(k); return t ? t.name : 'Équipe ' + k; };
		const tagOf = (k) => { const t = teamOf(k); return t ? t.tag || t.name : 'Équipe ' + k; };

		let prevKeys = [];
		let built = '';

		function cardHtml(s, i, steps, w) {
			const match = KB.rep.match.value || {};
			const stepIndex = steps.indexOf(s);
			const d = KB.map(s.map);
			const mm = mapEntry(match, s.map);
			const isDec = s.action === 'decider';
			let status = '';
			if (mm && mm.status === 'live') status = '<span class="kb-pill kb-pill--live">En cours</span>';
			else if (mm && mm.status === 'done') {
				// Score dans l'ordre des équipes affichées (gauche – droite, match.swap compris)
				const { leftKey, rightKey } = KB.sides(match);
				status = `<div class="done">${+mm['score' + leftKey] || 0} – ${+mm['score' + rightKey] || 0}<small>${mm.winner ? 'Victoire ' + esc(tagOf(mm.winner)) : 'Terminée'}</small></div>`;
			}
			let sides;
			if (s.side) {
				const chooser = s.sideTeam || M.defaultSideTeam(steps, stepIndex);
				const atk = s.side === 'attack' ? chooser : M.other(chooser);
				const def = M.other(atk);
				const chip = (cls, k, lbl) => `<div class="sd ${cls}">${KB.teamLogo(teamOf(k), 34)}<div><div class="k">${lbl}</div><div class="v">${esc(tagOf(k))}</div></div></div>`;
				sides = `<div class="sides">${chip('atk', atk, 'Attaque')}${chip('def', def, 'Défense')}</div>`;
			} else {
				const chooser = s.sideTeam || M.defaultSideTeam(steps, stepIndex);
				sides = `<div class="wait">${esc(tagOf(chooser))} choisit son côté…</div>`;
			}
			const by = isDec
				? '<div class="by"><span class="lb">Decider</span><span class="tn">Map décisive</span></div>'
				: `<div class="by">${KB.teamLogo(teamOf(s.team), 46)}<span class="lb">Pick</span><span class="tn">${esc(nameOf(s.team))}</span></div>`;
			return `<div class="cw kb-anim kb-anim--pop" style="--i:${3 + i};--w:${w}px">
				<div class="card ${isDec ? 'decider' : 'pick'} ${w < 440 ? 'narrow' : ''}" style="--c:${isDec ? 'var(--kb-gold-hi)' : esc(color(s.team))};--i:${i}">
					<div class="img" style="${d ? `background-image:url('${esc(d.splash || d.listView)}')` : ''}"></div>
					<div class="shade"></div><div class="gl m-glint" style="--gd:${2.5 + i * 1.3}s"></div><div class="edge"></div>
					<div class="num"><b>${String(i + 1).padStart(2, '0')}</b><span>Map</span></div>
					<div class="status">${status}</div>
					<div class="body"><div class="mn">${esc(s.map)}</div>${by}${sides}</div>
				</div></div>`;
		}

		function render(entering) {
			const match = KB.rep.match.value || {};
			const steps = (KB.rep.veto.value && KB.rep.veto.value.steps) || [];
			KB.$('#kicker').textContent = KB.joinDot(match.stage, KB.formatLabel(match.format));
			const sides = KB.sides(match);
			const mu = `<div class="t" style="--c:${esc(color(sides.leftKey))}"><span class="bar"></span>${KB.teamLogo(sides.left, 56)}<span>${esc(nameOf(sides.leftKey))}</span></div>
				<span class="vs">VS</span>
				<div class="t r" style="--c:${esc(color(sides.rightKey))}"><span class="bar"></span>${KB.teamLogo(sides.right, 56)}<span>${esc(nameOf(sides.rightKey))}</span></div>`;
			if (KB.$('#matchup').innerHTML !== mu) KB.$('#matchup').innerHTML = mu;

			const order = steps.filter((s) => s.action !== 'ban' && s.map);
			const n = order.length;
			const w = Math.min(600, Math.floor((1780 - 28 * (n - 1)) / Math.max(n, 1)));
			// Clé d'une carte = son HTML complet : tout ce qu'elle affiche (équipe, tag, couleur, logo, côtés, score, image) la remet à jour
			const keys = order.map((s, i) => cardHtml(s, i, steps, w));
			const box = KB.$('#cards');
			const layout = order.map((s) => s.map).join('|') + '/' + w;
			if (entering || layout !== built) {
				box.innerHTML = order.map((s, i) => cardHtml(s, i, steps, w)).join('');
				// cartes ajoutées après l'entrée : visibles directement, avec un petit rebond
				if (!entering) KB.$$('.cw', box).forEach((el, i) => { el.style.animation = 'none'; el.style.opacity = 1; if (keys[i] !== prevKeys[i]) el.firstElementChild.classList.add('changed'); });
				built = layout;
			} else {
				keys.forEach((k, i) => {
					if (k === prevKeys[i]) return;
					const tmp = document.createElement('div'); tmp.innerHTML = k;
					const el = tmp.firstElementChild; el.style.animation = 'none'; el.style.opacity = 1;
					el.firstElementChild.classList.add('changed');
					el.querySelector('.img').style.animation = 'img-drift 18s ease-in-out infinite alternate';
					box.children[i].replaceWith(el);
				});
			}
			KB.$$('.mn', box).forEach(fitName);
			prevKeys = keys;
			KB.$('#empty').style.display = n ? 'none' : 'block';

			const bans = steps.filter((s) => s.action === 'ban' && s.map);
			KB.$('#bans').innerHTML = bans.length ? `<span class="lbl">Bans</span>${bans.map((s) => `<div class="b">${KB.teamLogo(teamOf(s.team), 30)}<span>${esc(s.map)}</span></div>`).join('')}` : '';
		}

		// Polices chargées après le premier rendu : on réajuste la taille des noms de map
		document.fonts.ready.then(() => { if (scene.visible) KB.$$('#cards .mn').forEach(fitName); });
		KB.watch(['match', 'teams', 'veto', 'valorantData', gfx], () => {
			const vis = !!(gfx.value && gfx.value.vetoRecap && gfx.value.vetoRecap.visible);
			// Rendu d'apparition (scene.visible encore faux) : cartes reconstruites, entrées rejouées
			scene.set(vis, () => render(!scene.visible));
		});
	</script>
</body>
</html>
