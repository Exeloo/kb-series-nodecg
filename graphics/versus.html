<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
	<meta charset="utf-8">
	<title>Versus</title>
	<!-- Écran « versus » avant un match : équipes, rosters (agent pické / favori, rang), moyennes d'équipe.
	     Lit match, teams, playerProfiles, playerData, valorantData et matchGraphics.versus (visibilité).
	     Piloté par le panneau « Match » (dashboard/match.html). -->
	<link rel="stylesheet" href="../shared/theme.css">
	<link rel="stylesheet" href="../shared/match.css">
	<style>
		#stage { --l: var(--team-a); --r: var(--team-b); --l-rgb: var(--team-a-rgb); --r-rgb: var(--team-b-rgb); }

		/* ---------- Diagonales aux couleurs des équipes ---------- */
		.wash { position: absolute; top: 0; bottom: 0; width: 1100px; opacity: .55; }
		.wash.l { left: 0; background: linear-gradient(100deg, rgba(var(--l-rgb), .55) 0%, rgba(var(--l-rgb), .18) 55%, transparent 80%); clip-path: polygon(0 0, 100% 0, 78% 100%, 0 100%); }
		.wash.r { right: 0; background: linear-gradient(260deg, rgba(var(--r-rgb), .55) 0%, rgba(var(--r-rgb), .18) 55%, transparent 80%); clip-path: polygon(22% 0, 100% 0, 100% 100%, 0 100%); }
		.kb-in .wash.l { animation: wash-l 1.1s var(--kb-ease-out) both; }
		.kb-in .wash.r { animation: wash-r 1.1s var(--kb-ease-out) both; }
		@keyframes wash-l { from { transform: translateX(-300px); opacity: 0; } to { opacity: .55; } }
		@keyframes wash-r { from { transform: translateX(300px); opacity: 0; } to { opacity: .55; } }
		.diag { position: absolute; top: 372px; bottom: 210px; left: 50%; width: 6px; overflow: hidden; background: linear-gradient(180deg, transparent, var(--kb-gold) 20%, var(--kb-gold-hi) 50%, var(--kb-gold) 80%, transparent); transform: translateX(-50%) skewX(-12deg); box-shadow: 0 0 20px rgba(245, 196, 69, .5); opacity: .8; }
		.diag::after { content: ''; position: absolute; left: 0; right: 0; height: 120px; top: 0; background: linear-gradient(180deg, transparent, #fff, transparent); animation: diag-run 3.2s ease-in-out infinite 1.4s; transform: translateY(-140px); }
		@keyframes diag-run { 0% { transform: translateY(-140px); } 60%, 100% { transform: translateY(620px); } }
		.diag.d2 { width: 2px; margin-left: -34px; opacity: .45; }
		.diag.d3 { width: 2px; margin-left: 34px; opacity: .45; }
		.diag.d2::after, .diag.d3::after { animation-delay: 2.2s; }
		.kb-in .diag { animation: diag-in 1s var(--kb-ease-out) .1s both; }
		@keyframes diag-in { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }

		/* ---------- Haut : équipes + centre ---------- */
		#top { position: absolute; left: 70px; right: 70px; top: 64px; height: 300px; display: grid; grid-template-columns: 1fr 340px 1fr; align-items: center; }
		.team { display: flex; align-items: center; gap: 34px; min-width: 0; }
		.team.r { flex-direction: row-reverse; text-align: right; }
		.team .logo { flex: 0 0 250px; height: 250px; display: grid; place-items: center; position: relative; }
		/* Halo : profil d'un disque de 220 px flouté à 60 px, dessiné en dégradé (un filtre flou animé coûte cher à OBS) */
		.team .logo .halo { position: absolute; inset: -150px; background: radial-gradient(circle 275px,
			rgba(var(--c-rgb), .81) 0, rgba(var(--c-rgb), .79) 25px, rgba(var(--c-rgb), .71) 50px,
			rgba(var(--c-rgb), .59) 75px, rgba(var(--c-rgb), .44) 100px, rgba(var(--c-rgb), .3) 125px,
			rgba(var(--c-rgb), .18) 150px, rgba(var(--c-rgb), .095) 175px, rgba(var(--c-rgb), .044) 200px,
			rgba(var(--c-rgb), .017) 225px, rgba(var(--c-rgb), .006) 250px, transparent 275px); }
		.team .logo .m-float { position: relative; }
		.team .txt { min-width: 0; flex: 1; }
		.team .tag { display: inline-block; padding: 4px 16px; background: var(--c); color: #04061a; font: 700 18px var(--kb-ui); letter-spacing: .3em; text-transform: uppercase; clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); }
		.team .name { margin-top: 6px; padding-top: .1em; font: 400 76px/1.04 var(--kb-display); text-transform: uppercase; letter-spacing: .01em; overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; text-shadow: 0 4px 24px rgba(0, 0, 0, .5); }
		.team .rec { margin-top: 12px; font: 600 15px var(--kb-ui); letter-spacing: .22em; text-transform: uppercase; color: var(--kb-muted); }

		#center { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
		#kbsWrap { width: 150px; height: 150px; border-radius: 50%; }
		#kbsWrap img { width: 150px; }
		#center .kb-kicker { font-size: 17px; letter-spacing: .26em; white-space: nowrap; }
		#series { font: 700 16px var(--kb-ui); letter-spacing: .2em; color: var(--kb-muted); text-transform: uppercase; }
		#series b { display: inline-block; font: 400 30px/1 var(--kb-display); color: var(--kb-text); letter-spacing: .05em; margin: 0 6px; }

		/* ---------- Rosters ---------- */
		#mid { position: absolute; left: 70px; right: 70px; top: 396px; height: 450px; display: grid; grid-template-columns: 1fr 260px 1fr; }
		#vs { display: grid; place-items: center; font: 400 200px/1 var(--kb-display); font-style: italic; padding-right: 10px;
			background: linear-gradient(110deg, var(--kb-gold) 0%, var(--kb-gold-hi) 35%, #fff6d8 48%, var(--kb-gold-hi) 60%, var(--kb-gold) 100%); background-size: 300% 100%; background-position: 100% 0;
			-webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 0 30px rgba(245, 196, 69, .35)); }
		.kb-in #vs { animation: kb-pop .7s var(--kb-ease-out) forwards, vs-shine 5s ease-in-out 1.6s infinite; animation-delay: calc(.2s + 4 * 70ms), 1.6s; }
		@keyframes vs-shine { 0% { background-position: 100% 0; } 40%, 100% { background-position: 0 0; } }

		.roster { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
		.p { position: relative; height: 82px; display: flex; align-items: center; gap: 16px; padding: 0 20px 0 0; background: linear-gradient(90deg, rgba(17, 24, 69, .92), rgba(10, 15, 46, .7)); border: 1px solid var(--kb-line); clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); }
		.roster.r .p { flex-direction: row-reverse; text-align: right; background: linear-gradient(270deg, rgba(17, 24, 69, .92), rgba(10, 15, 46, .7)); clip-path: polygon(0 16px, 16px 0, 100% 0, 100% 100%, 0 100%); padding: 0 0 0 20px; }
		.p::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--c); z-index: 2; }
		.roster.r .p::before { left: auto; right: 0; }
		/* Médaillon photo (standing détouré : on cadre le haut du buste) */
		.p .ph { position: relative; flex: 0 0 86px; align-self: stretch; overflow: hidden; background: linear-gradient(180deg, rgba(var(--c-rgb), .35), rgba(4, 6, 26, .6)); }
		.p .ph img { position: absolute; left: 50%; top: 4px; width: 150%; transform: translateX(-50%); object-fit: cover; object-position: top center; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .6)); }
		.p .ph .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 400 40px var(--kb-display); color: rgba(243, 241, 234, .35); }
		.p .ph::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 30%; background: linear-gradient(180deg, transparent, rgba(4, 6, 26, .6)); }
		.p .who { flex: 1; min-width: 0; }
		.p .nm { font: 400 38px/1 var(--kb-display); text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.p .role { margin-top: 6px; font: 600 13px var(--kb-ui); letter-spacing: .2em; text-transform: uppercase; color: var(--kb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
		.p .real { color: var(--kb-text); opacity: .7; letter-spacing: .08em; text-transform: none; font-weight: 500; }
		.p .ag { flex: 0 0 196px; display: flex; align-items: center; gap: 12px; }
		.roster.r .p .ag { flex-direction: row-reverse; }
		.p .ag .ic { flex: 0 0 54px; height: 54px; background: rgba(0, 0, 0, .3) center / cover; border-bottom: 3px solid var(--ac, var(--c)); }
		.p .ag .ic.none { display: grid; place-items: center; color: var(--kb-muted); font: 600 20px var(--kb-num); border-bottom-color: var(--kb-line); }
		.p .ag .al { font: 600 10px var(--kb-ui); letter-spacing: .18em; color: var(--kb-muted); text-transform: uppercase; white-space: nowrap; }
		.p .ag .al.pick { color: var(--kb-gold); }
		.p .ag .an { margin-top: 3px; font: 400 26px/1 var(--kb-display); text-transform: uppercase; white-space: nowrap; }
		.p .rank { flex: 0 0 168px; display: flex; align-items: center; gap: 10px; }
		.roster.r .p .rank { flex-direction: row-reverse; }
		.p .rank img { width: 48px; height: 48px; object-fit: contain; }
		.p .rank .rn { font: 700 21px/1 var(--kb-num); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
		.p .rank .rl { font: 600 10px var(--kb-ui); letter-spacing: .2em; color: var(--kb-muted); text-transform: uppercase; margin-bottom: 4px; }
		.p .rank.none .rn { color: var(--kb-muted); }
		.p.empty { background: rgba(10, 15, 46, .35); border-style: dashed; border-color: rgba(140, 170, 255, .22); }
		.p.empty::before { opacity: .35; }
		.p.empty .nm { color: rgba(243, 241, 234, .35); }
		.p.empty .ph { background: transparent; border-right: 1px dashed rgba(140, 170, 255, .2); }
		.roster.r .p.empty .ph { border-right: 0; border-left: 1px dashed rgba(140, 170, 255, .2); }
		.p.empty .ph::after { display: none; }
		.p.empty .ph .ini { font-size: 30px; color: rgba(142, 154, 200, .5); }
		/* entrée des lignes : glissement + masque */
		.kb-in .roster.l .p.kb-anim { animation-name: row-l; }
		.kb-in .roster.r .p.kb-anim { animation-name: row-r; }
		@keyframes row-l { from { opacity: 0; transform: translateX(-80px); clip-path: polygon(0 0, 0 0, 0 100%, 0 100%); } to { opacity: 1; transform: none; clip-path: polygon(0 0, calc(100% - 16px) 0, 100% 16px, 100% 100%, 0 100%); } }
		@keyframes row-r { from { opacity: 0; transform: translateX(80px); clip-path: polygon(100% 16px, 100% 0, 100% 0, 100% 100%, 100% 100%); } to { opacity: 1; transform: none; clip-path: polygon(0 16px, 16px 0, 100% 0, 100% 100%, 0 100%); } }
		@keyframes row-refresh { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }
		.p .glint { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
		.p .glint::after { content: ''; position: absolute; top: 0; bottom: 0; width: 22%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .07), transparent); transform: translateX(-150%) skewX(-18deg); animation: row-glint 9s ease-in-out infinite; animation-delay: var(--gd, 3s); }
		@keyframes row-glint { 0% { transform: translateX(-150%) skewX(-18deg); } 20%, 100% { transform: translateX(600%) skewX(-18deg); } }

		/* ---------- Stats d'équipe ---------- */
		#bottom { position: absolute; left: 70px; right: 70px; top: 868px; height: 78px; display: grid; grid-template-columns: 1fr 260px 1fr; }
		#statsLbl { display: grid; place-items: center; text-align: center; font: 700 14px/1.5 var(--kb-ui); letter-spacing: .24em; color: var(--kb-gold); text-transform: uppercase; }
		.tstats { display: grid; grid-template-columns: repeat(3, 1fr) 1.2fr; border: 1px solid var(--kb-gold-dim); background: rgba(4, 6, 26, .6); }
		.tstats > div { display: flex; flex-direction: column; justify-content: center; padding: 0 22px; border-right: 1px solid var(--kb-line); }
		.tstats > div:last-child { border-right: 0; }
		.tstats .v { font: 400 38px/1 var(--kb-display); }
		.tstats .k { margin-top: 4px; font: 600 12px var(--kb-ui); letter-spacing: .22em; color: var(--kb-muted); text-transform: uppercase; }
		.tstats .note { font: 600 13px/1.4 var(--kb-ui); letter-spacing: .12em; color: var(--kb-muted); text-transform: uppercase; }
		.tstats.na { grid-template-columns: 1fr; }

		/* ---------- Partenaires ---------- */
		#partners { position: absolute; left: 0; right: 0; bottom: 48px; display: flex; justify-content: center; align-items: center; gap: 22px; font: 600 14px var(--kb-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--kb-muted); }
		#partners img { height: 30px; }
		#partners .dot { width: 6px; height: 6px; background: var(--kb-gold); transform: rotate(45deg); }
	</style>
</head>
<body>
	<div id="stage" class="kb-scene">
		<div class="kb-bg"><div class="kb-bg__art"></div><div class="kb-bg__grid"></div><div class="kb-bg__stars"></div><div class="m-drift"></div></div>
		<div class="wash l"></div><div class="wash r"></div>
		<div class="diag"></div><div class="diag d2"></div><div class="diag d3"></div>
		<div class="kb-frame"></div>

		<div id="top">
			<div class="team l kb-anim kb-anim--left" id="teamL" style="--i:1"></div>
			<div id="center">
				<div id="kbsWrap" class="kb-anim kb-anim--pop m-glint" style="--i:0"><img class="kb-logo" id="kbs" alt=""></div>
				<div class="kb-kicker kb-anim" id="stageLbl" style="--i:1"></div>
				<div class="kb-anim" style="--i:2"><span class="kb-pill" id="format"></span></div>
				<div id="series" class="kb-anim" style="--i:3"></div>
			</div>
			<div class="team r kb-anim kb-anim--right" id="teamR" style="--i:1"></div>
		</div>

		<div id="mid">
			<div class="roster l" id="rosterL"></div>
			<div id="vs" class="kb-anim">VS</div>
			<div class="roster r" id="rosterR"></div>
		</div>

		<div id="bottom">
			<div class="tstats l kb-anim" id="statsL" style="--i:11"></div>
			<div id="statsLbl" class="kb-anim" style="--i:11">Moyennes<br>d'équipe</div>
			<div class="tstats r kb-anim" id="statsR" style="--i:11"></div>
		</div>

		<div id="partners" class="kb-anim" style="--i:13"><span>Présenté par</span><img id="logoCycom" alt=""><span class="dot"></span><span>Édition spéciale</span><img id="logoEpitech" alt=""></div>
	</div>

	<script src="../shared/kb.js"></script>
	<script src="../shared/match.js"></script>
	<script>
		const gfx = KBMatch.gfx();
		const stage = KB.$('#stage');
		const scene = KB.scene(stage, { outMs: 450 });
		KB.$('#kbs').src = KB.img.kbs;
		KB.$('#logoCycom').src = KB.img.cycom;
		KB.$('#logoEpitech').src = KB.img.epitech;

		const avg = (arr) => (arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null);
		const statVal = (pl, k) => (pl && pl.stats && pl.stats[k] && typeof pl.stats[k].value === 'number' ? pl.stats[k].value : null);
		const esc = KB.esc;
		const fitName = (el) => KB.fit(el, { max: 76, min: 50, wrap: true });

		function teamBlock(team, key) {
			const players = ((team && team.players) || []).filter((p) => p && p.riotId);
			return `<div class="logo"><div class="halo m-breathe"></div><div class="m-float">${KB.teamLogo(team, 230)}</div></div>
				<div class="txt">
					<span class="tag">${esc(team && team.tag ? team.tag : 'Équipe ' + key)}</span>
					<div class="name">${esc(team ? team.name : 'À déterminer')}</div>
					${players.length > 5 ? `<div class="rec">+ ${players.length - 5} remplaçant${players.length > 6 ? 's' : ''}</div>` : ''}
				</div>`;
		}

		/** Une ligne de roster → { key, html, agent } (agent = nom, pour l'animation au changement) */
		function rowData(slot, i, mapName) {
			const style = `--i:${5 + i};--gd:${3 + i * 0.6}s`;
			if (!slot || !slot.riotId) {
				const role = slot && slot.role ? KB.roleLabel(slot.role) : `Joueur ${i + 1}`;
				return { key: 'empty' + i + role, agent: '', html: `<div class="p empty kb-anim" style="${style}"><div class="ph"><span class="ini">${i + 1}</span></div><div class="who"><div class="nm">À définir</div><div class="role">${esc(role)}</div></div><div class="ag"></div><div class="rank none"></div></div>` };
			}
			const pl = KB.player(slot.riotId) || { name: String(slot.riotId).split('#')[0], stats: {}, agents: [] };
			const pick = KB.pickOf(slot.riotId);
			const ag = pick || (pl.agents && pl.agents[0]) || null;
			const agLbl = pick ? (mapName ? `Agent sur ${mapName}` : 'Agent pické') : 'Agent favori';
			const role = KB.roleLabel(slot.role || pl.role);
			const html = `<div class="p kb-anim" style="${style}"><div class="glint"></div>
				<div class="ph">${pl.photo ? `<img src="${esc(pl.photo)}" alt="">` : `<span class="ini">${esc((pl.name || '?').slice(0, 1).toUpperCase())}</span>`}</div>
				<div class="who"><div class="nm">${esc(pl.name)}</div><div class="role">${esc(role)}${pl.realName ? `${role ? ' · ' : ''}<span class="real">${esc(pl.realName)}</span>` : ''}</div></div>
				<div class="ag" data-ag>${ag ? `<div class="ic" style="${ag.icon ? `background-image:url('${esc(ag.icon)}');` : ''}${ag.color ? `--ac:${esc(ag.color)}` : ''}"></div><div><div class="al ${pick ? 'pick' : ''}">${esc(agLbl)}</div><div class="an">${esc(ag.name)}</div></div>`
					: '<div class="ic none">–</div><div><div class="al">Agent</div><div class="an" style="color:var(--kb-muted)">–</div></div>'}</div>
				${pl.rank ? `<div class="rank">${pl.rank.icon ? `<img src="${esc(pl.rank.icon)}" alt="">` : ''}<div><div class="rl">Rang</div><div class="rn">${esc(pl.rank.name)}</div></div></div>`
					: '<div class="rank none"><div><div class="rl">Rang</div><div class="rn">–</div></div></div>'}
			</div>`;
			return { key: html, agent: ag ? ag.name : '', html };
		}

		const cache = { L: {}, R: {} };   // html déjà affiché par bloc (évite de relancer les boucles)

		function renderRoster(side, team, mapName, entering) {
			const box = KB.$('#roster' + side);
			const slots = ((team && team.players) || []).slice(0, 5);
			const prev = cache[side].rows || [];
			const rows = [0, 1, 2, 3, 4].map((i) => rowData(slots[i], i, mapName));
			if (entering || box.children.length !== 5) {
				box.innerHTML = rows.map((r) => r.html).join('');
			} else {
				rows.forEach((r, i) => {
					if (prev[i] && prev[i].key === r.key) return;
					const tmp = document.createElement('div'); tmp.innerHTML = r.html;
					const el = tmp.firstElementChild;
					el.style.opacity = 1;
					// agent qui change (nouveau pick) → animation sur le bloc agent, sinon léger rebond de la ligne
					const agChanged = prev[i] && prev[i].agent !== r.agent && el.querySelector('[data-ag]');
					el.style.animation = agChanged ? 'none' : 'row-refresh .5s var(--kb-ease-out)';
					if (agChanged) el.querySelector('[data-ag]').classList.add('m-bump');
					box.children[i].replaceWith(el);
				});
			}
			cache[side].rows = rows;
		}

		function teamStats(team) {
			const pls = ((team && team.players) || []).slice(0, 5).filter((p) => p && p.riotId).map((p) => KB.player(p.riotId)).filter(Boolean);
			const withData = pls.filter((p) => statVal(p, 'acs') != null || statVal(p, 'kd') != null || statVal(p, 'hs') != null);
			if (!withData.length) return { na: true, html: '<div><div class="note">Stats indisponibles<br>(aucune stat joueur renseignée)</div></div>' };
			const acs = avg(withData.map((p) => statVal(p, 'acs')).filter((v) => v != null));
			const kd = avg(withData.map((p) => statVal(p, 'kd')).filter((v) => v != null));
			const hs = avg(withData.map((p) => statVal(p, 'hs')).filter((v) => v != null));
			const cell = (v, k) => `<div><div class="v" data-v="${esc(v)}">${esc(v)}</div><div class="k">${k}</div></div>`;
			return {
				na: false,
				html: cell(acs != null ? acs.toFixed(0) : '–', 'ACS moy.') + cell(kd != null ? kd.toFixed(2) : '–', 'K/D moy.') + cell(hs != null ? hs.toFixed(1) + '%' : '–', 'HS% moy.')
					+ `<div><div class="note">${withData.length}/5 joueurs<br>avec stats</div></div>`,
			};
		}

		function setHTML(el, html, side, key) {
			if (cache[side][key] === html) return false;
			cache[side][key] = html; el.innerHTML = html; return true;
		}

		function render(entering) {
			const match = KB.rep.match.value || {};
			const sides = KB.sides(match);
			const cur = (match.maps || [])[match.currentMap];
			const mapName = cur && cur.map;
			KB.setColor(stage, 'l', KB.teamColor(sides.left, sides.leftKey));
			KB.setColor(stage, 'r', KB.teamColor(sides.right, sides.rightKey));
			KB.$('#stageLbl').textContent = match.stage || '';
			KB.$('#format').textContent = KB.formatLabel(match.format) || 'BO1';
			const sc = KB.seriesScore(match);
			const played = (match.maps || []).some((m) => m.winner === 'A' || m.winner === 'B');
			const seriesHtml = played ? `Série <b>${sc[sides.leftKey]} – ${sc[sides.rightKey]}</b>` : '';
			if (KB.$('#series').innerHTML !== seriesHtml) { KB.$('#series').innerHTML = seriesHtml; if (!entering && played) KB.$('#series b').classList.add('m-bump'); }

			for (const [side, team, key] of [['L', sides.left, sides.leftKey], ['R', sides.right, sides.rightKey]]) {
				const color = KB.teamColor(team, key);
				const t = KB.$('#team' + side);
				KB.setColor(t, 'c', color);
				if (setHTML(t, teamBlock(team, key), side, 'team') || entering) fitName(t.querySelector('.name'));
				const r = KB.$('#roster' + side);
				KB.setColor(r, 'c', color);
				renderRoster(side, team, mapName, entering);
				const s = teamStats(team);
				const st = KB.$('#stats' + side);
				st.classList.toggle('na', s.na);
				if (setHTML(st, s.html, side, 'stats') || entering) {
					// compteurs animés à l'entrée / au changement
					KB.$$('.v', st).forEach((el) => KB.countUp(el, el.dataset.v, { delay: entering ? 1100 : 0, duration: 900 }));
				}
			}
		}

		// Polices chargées après le premier rendu : on réajuste la taille des noms
		document.fonts.ready.then(() => { if (scene.visible) KB.$$('.team .name').forEach(fitName); });
		KB.watch(['match', 'teams', 'playerProfiles', 'playerData', 'valorantData', gfx], () => {
			const vis = !!(gfx.value && gfx.value.versus && gfx.value.versus.visible);
			// Rendu d'apparition (scene.visible encore faux) : on repart de zéro pour rejouer les entrées
			scene.set(vis, () => {
				const entering = !scene.visible;
				if (entering) { cache.L = {}; cache.R = {}; }
				render(entering);
			});
		});
	</script>
</body>
</html>
