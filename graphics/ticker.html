<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
<meta charset="utf-8">
<title>KB SERIES · Ticker</title>
<!--
	Bandeau défilant en bas de l'écran (messages + partenaires), par-dessus le jeu.
	Replicant lu : liveTicker (défauts : LIVE.defaults.liveTicker, shared/live.js), piloté par le panneau Ticker (dashboard/ticker.html).
-->
<link rel="stylesheet" href="../shared/theme.css">
<style>
	/* Bandeau bas plein largeur, 44 px (y 1036 → 1080) */
	#ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; display: flex; visibility: hidden; transform: translateY(100%); transition: transform .5s var(--kb-ease-out); }
	#ticker.kb-in { transform: none; }
	#ticker.kb-out { transform: translateY(100%); transition: transform .3s var(--kb-ease-inout); }
	#ticker::before { content: ''; position: absolute; left: 0; right: 0; top: -2px; height: 2px; z-index: 3; background: linear-gradient(90deg, var(--kb-gold), var(--kb-gold-hi) 20%, var(--kb-blue) 50%, var(--kb-gold-hi) 80%, var(--kb-gold)); box-shadow: 0 0 10px rgba(245, 196, 69, .35); }

	.brand { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 44px 0 154px; background: linear-gradient(180deg, #d8c287, var(--kb-gold)); clip-path: polygon(0 0, 100% 0, calc(100% - 26px) 100%, 0 100%); color: var(--kb-ink); overflow: hidden; }
	.brand b { font: 400 24px/1 var(--kb-display); letter-spacing: .06em; position: relative; }
	/* reflet qui balaye le bloc doré */
	.brand::after { content: ''; position: absolute; top: 0; bottom: 0; width: 60px; left: 0; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .55), transparent); transform: translateX(-80px) skewX(-20deg); animation: brand-shine 7s ease-in-out 1s infinite; }
	@keyframes brand-shine { 0% { transform: translateX(-80px) skewX(-20deg); } 25%, 100% { transform: translateX(340px) skewX(-20deg); } }
	/* lumière qui court sur le filet doré */
	#ticker::after { content: ''; position: absolute; left: 0; top: -3px; width: 240px; height: 4px; z-index: 4; background: radial-gradient(ellipse at center, #fff 0%, rgba(255, 240, 200, .8) 25%, transparent 70%); animation: rail-run 9s linear infinite; }
	@keyframes rail-run { from { transform: translateX(-260px); } to { transform: translateX(1940px); } }

	/* ---- Médaille KB SERIES en 3D (rotation continue, tranche épaisse, reflet) ---- */
	.coin-wrap { position: absolute; left: 56px; bottom: 2px; width: 88px; height: 88px; z-index: 5; perspective: 520px; }
	.coin-shadow { position: absolute; left: 14px; right: 14px; bottom: -4px; height: 8px; border-radius: 50%; background: radial-gradient(ellipse, rgba(0, 0, 0, .55), transparent 70%); animation: coin-shadow 7s linear infinite; }
	.coin { position: absolute; inset: 0; transform-style: preserve-3d; animation: coin-spin 7s linear infinite; }
	.coin > * { position: absolute; backface-visibility: hidden; }
	/* faces : le PNG fait 800×693, le disque occupe 86 % de la largeur → 76 px de diamètre ici */
	.coin .face { left: 0; top: 6px; width: 88px; height: 76px; object-fit: contain; }
	.coin .face.front { transform: translateZ(6px); }
	.coin .face.back { transform: rotateY(180deg) translateZ(6px); }
	/* tranche : pile de disques dorés */
	.coin .edge { left: 6px; top: 6px; width: 76px; height: 76px; border-radius: 50%; backface-visibility: visible; background: linear-gradient(90deg, #6d5320, #e9cf86 45%, #fff2c4 52%, #b8964a 60%, #5c4519); }
	/* reflet : bande lumineuse qui glisse sur chaque face pendant qu'elle est de face */
	.coin .gloss { left: 6px; top: 6px; width: 76px; height: 76px; border-radius: 50%; overflow: hidden; transform: translateZ(6.5px); pointer-events: none; }
	.coin .gloss.back { transform: rotateY(180deg) translateZ(6.5px); }
	.coin .gloss::before { content: ''; position: absolute; top: -20%; bottom: -20%; width: 45%; left: 0; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .6), transparent); transform: translateX(-120%) skewX(-18deg); animation: coin-gloss 7s linear infinite; }
	.coin .gloss.back::before { animation-delay: -3.5s; }
	@keyframes coin-spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
	@keyframes coin-gloss { 0% { transform: translateX(260%) skewX(-18deg); } 25% { transform: translateX(-120%) skewX(-18deg); } 25.01%, 75% { transform: translateX(260%) skewX(-18deg); } 100% { transform: translateX(260%) skewX(-18deg); } }
	@keyframes coin-shadow { 0%, 50%, 100% { transform: scaleX(1); } 25%, 75% { transform: scaleX(.35); } }
	#ticker.kb-in .coin-wrap { animation: coin-drop .9s var(--kb-ease-out) .2s both; }
	@keyframes coin-drop { from { opacity: 0; transform: translateY(40px) scale(.6); } to { opacity: 1; transform: none; } }

	.track-wrap { position: relative; flex: 1; overflow: hidden; margin-left: -26px; background: linear-gradient(180deg, rgba(17, 24, 69, .96), rgba(4, 6, 26, .97)); mask-image: linear-gradient(90deg, transparent 0, #000 60px, #000 calc(100% - 60px), transparent); }
	.track { position: absolute; top: 0; bottom: 0; left: 0; display: flex; align-items: center; white-space: nowrap; will-change: transform; }
	.item { display: flex; align-items: center; height: 44px; font: 600 18px var(--kb-ui); letter-spacing: .14em; text-transform: uppercase; color: var(--kb-text); }
	.sep { display: inline-block; width: 9px; height: 9px; margin: 0 34px; transform: rotate(45deg); background: var(--kb-gold); box-shadow: 0 0 8px rgba(245, 196, 69, .6); flex: 0 0 auto; }
	.partner { gap: 16px; color: var(--kb-gold); font-size: 15px; letter-spacing: .28em; }
	.partner img { height: 34px; width: auto; object-fit: contain; }
	.partner img.epi { height: 22px; }

	.live { position: relative; z-index: 2; flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 0 64px 0 40px; margin-left: -20px; background: linear-gradient(180deg, rgba(17, 24, 69, .98), rgba(4, 6, 26, .98)); clip-path: polygon(20px 0, 100% 0, 100% 100%, 0 100%); font: 700 15px var(--kb-ui); letter-spacing: .28em; color: var(--kb-text); }
	.live i { width: 10px; height: 10px; border-radius: 50%; background: var(--kb-red); box-shadow: 0 0 10px var(--kb-red); animation: blink 1.4s ease-in-out infinite; }
	@keyframes blink { 50% { opacity: .3; } }
</style>
</head>
<body>
	<div id="ticker">
		<div class="brand"><b>KB SERIES</b></div>
		<div class="coin-wrap"><div class="coin-shadow"></div><div class="coin" id="coin"></div></div>
		<div class="track-wrap"><div class="track" id="track"></div></div>
		<div class="live"><i></i>LIVE</div>
	</div>

<script src="../shared/kb.js"></script>
<script src="../shared/live.js"></script>
<script>
	const rep = nodecg.Replicant('liveTicker', { defaultValue: LIVE.defaults.liveTicker });
	const root = KB.$('#ticker');
	const track = KB.$('#track');
	const pres = KB.presence(root, 320);
	// Médaille 3D : 11 disques pour la tranche (épaisseur 10 px) + 2 faces + 2 reflets
	KB.$('#coin').innerHTML = Array.from({ length: 11 }, (_, i) => `<div class="edge" style="transform:translateZ(${i - 5}px)"></div>`).join('')
		+ `<img class="face front" src="${KB.img.kbs}" alt=""><img class="face back" src="${KB.img.kbs}" alt=""><div class="gloss"></div><div class="gloss back"></div>`;
	let key = '';
	let anim = null;
	let seq = 0; // jeton : seul le dernier build() lancé a le droit de finir

	function items(v) {
		const out = (v.messages || []).map((m) => String(m || '').trim()).filter(Boolean).map((m) => `<span class="item">${KB.esc(m)}</span>`);
		if (v.partners !== false) {
			out.push(`<span class="item partner">Présenté par <img src="${KB.img.cycom}" alt="CYCOM"></span>`);
			out.push(`<span class="item partner">Édition spéciale <img class="epi" src="${KB.img.epitech}" alt="EPITECH"></span>`);
		}
		if (!out.length) out.push('<span class="item">KB SERIES — Tournoi Valorant 5v5</span>');
		return out.join('<i class="sep"></i>') + '<i class="sep"></i>';
	}

	async function build(v) {
		const id = ++seq;
		const html = items(v);
		// La largeur ne se mesure qu'une fois polices et logos chargés (sinon la boucle saute)
		track.innerHTML = html;
		void track.offsetWidth; // la mise en page lance le chargement des polices du nouveau texte
		const imgs = [...track.querySelectorAll('img')].map((img) => img.complete ? 0 : new Promise((r) => { img.onload = img.onerror = r; }));
		await Promise.all([document.fonts.ready, ...imgs]);
		if (id !== seq) return;
		// On répète le contenu jusqu'à couvrir l'écran, on double le tout, puis on boucle sur une moitié
		const reps = Math.max(1, Math.ceil(1920 / (track.getBoundingClientRect().width || 1)));
		const half = html.repeat(reps);
		track.innerHTML = half + half;
		const dist = track.getBoundingClientRect().width / 2; // largeur exacte (sous-pixel) d'une moitié
		const speed = Math.max(20, +v.speed || 90);
		if (anim) anim.cancel();
		anim = track.animate([{ transform: 'translateX(0)' }, { transform: `translateX(-${dist}px)` }], { duration: (dist / speed) * 1000, iterations: Infinity });
		if (!pres.visible) anim.pause();
	}

	function render() {
		const v = rep.value || {};
		const k = JSON.stringify([v.messages, v.partners, v.speed]);
		if (k !== key) { key = k; build(v); }
		if (v.visible && !pres.visible) { pres.show(); if (anim) anim.play(); }
		// Masqué : défilement en pause, comme les boucles CSS sous .kb-idle
		else if (!v.visible && pres.visible) pres.hide().then(() => { if (!pres.visible && anim) anim.pause(); });
	}

	KB.watch([rep], render);
</script>
</body>
</html>
