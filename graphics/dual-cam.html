<!DOCTYPE html>
<html lang="fr" class="kb-graphic">
<head>
<meta charset="utf-8">
<title>KB SERIES · Écran 50/50</title>
<!--
	Scène plein écran « 50/50 » : fond percé de deux trous 16:9 pour les caméras (LIVE.dualFrames), labels et bandeau du match.
	Replicants lus : liveDualCam (défauts : LIVE.defaults.liveDualCam), match, teams, playerData, playerProfiles, valorantData.
	Choisie dans la régie (scène de fond de stream.html) ; labels réglés dans le panneau Écran 50/50 (dashboard/dual-cam.html).
-->
<link rel="stylesheet" href="../shared/theme.css">
<style>
	/* Fond plein écran percé de deux trous transparents (LIVE.dualFrames) via clip-path evenodd. */
	#bg { position: absolute; inset: 0; }
	#bg .kb-bg__art { opacity: .4; }
	svg#frames { position: absolute; inset: 0; width: 1920px; height: 1080px; pointer-events: none; overflow: visible; }
	#frames .edge { fill: none; stroke: var(--kb-gold); stroke-width: 3; stroke-dasharray: var(--len); stroke-dashoffset: var(--len); filter: drop-shadow(0 0 6px rgba(245, 196, 69, .35)); }
	#frames .run { fill: none; stroke: #fff6d8; stroke-width: 4; stroke-linecap: round; stroke-dasharray: 140 var(--len); opacity: 0; filter: drop-shadow(0 0 8px var(--kb-gold-hi)); }
	#frames .corner { fill: none; stroke: var(--kb-gold-hi); stroke-width: 7; stroke-linecap: square; opacity: 0; }
	#frames .glow { fill: none; stroke: var(--kb-blue-hi); stroke-width: 1; opacity: 0; }
	.kb-in #frames .edge { animation: draw 1.3s var(--kb-ease-out) forwards; animation-delay: calc(.2s + var(--i) * .15s); }
	.kb-in #frames .corner { animation: fade-in .5s ease forwards, corner-breathe 3.4s ease-in-out 1.6s infinite; animation-delay: calc(1s + var(--i) * .15s), calc(1.6s + var(--i) * 1.7s); }
	.kb-in #frames .glow { animation: glow-in .6s ease forwards; animation-delay: calc(1s + var(--i) * .15s); }
	/* lumière qui fait le tour de chaque cadre */
	.kb-in #frames .run { animation: run 7s linear infinite; animation-delay: calc(1.6s + var(--i) * 3.5s); }
	@keyframes draw { to { stroke-dashoffset: 0; } }
	@keyframes fade-in { to { opacity: 1; } }
	@keyframes glow-in { to { opacity: .45; } }
	@keyframes corner-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
	@keyframes run { 0% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: calc(-1 * var(--len)); opacity: 1; } }

	/* Positions calées sur les trous (LIVE.dualFrames, format 16:9) : --fy = haut des trous, --fb = bas (posées par drawFrames) */
	#root { --fy: 220px; --fb: 724px; }
	/* Séparation centrale */
	.seam { position: absolute; left: 958px; top: calc(var(--fy) + 30px); width: 4px; height: calc(var(--fb) - var(--fy) - 60px); border-radius: 4px; background: linear-gradient(180deg, transparent, var(--kb-gold) 20%, var(--kb-gold-hi) 50%, var(--kb-gold) 80%, transparent); opacity: .7; transform: scaleY(0); overflow: hidden; }
	.kb-in .seam { animation: seam-in 1s var(--kb-ease-out) .5s forwards; }
	@keyframes seam-in { to { transform: none; } }
	.seam::after { content: ''; position: absolute; left: -2px; right: -2px; height: 120px; top: -140px; background: linear-gradient(180deg, transparent, #fff, transparent); animation: seam-run 4.5s ease-in-out 2s infinite; }
	@keyframes seam-run { 0% { top: -140px; } 60%, 100% { top: calc(100% + 20px); } }

	/* Labels de chaque moitié */
	.label { position: absolute; top: calc(var(--fb) + 32px); height: 98px; max-width: 600px; display: flex; align-items: center; gap: 18px; padding: 0 34px 0 28px; --kb-cut: 18px; border-color: var(--kb-gold-dim); }
	.label.l { left: 64px; }
	.label.r { right: 64px; flex-direction: row-reverse; text-align: right; padding: 0 28px 0 34px; clip-path: polygon(0 0, calc(100% - var(--kb-cut)) 0, 100% var(--kb-cut), 100% 100%, var(--kb-cut) 100%, 0 calc(100% - var(--kb-cut))); }
	.label::before { content: ''; position: absolute; top: 0; bottom: 0; width: 5px; background: var(--c, var(--kb-gold)); box-shadow: 0 0 14px var(--c, var(--kb-gold)); animation: bar-breathe 2.8s ease-in-out infinite; }
	.label.l::before { left: 0; } .label.r::before { right: 0; }
	@keyframes bar-breathe { 50% { filter: brightness(1.4); box-shadow: 0 0 24px var(--c, var(--kb-gold)); } }
	.label::after { content: ''; position: absolute; top: 0; bottom: 0; width: 30%; left: -40%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .08), transparent); transform: skewX(-20deg); animation: sweep 7s ease-in-out 2s infinite; }
	/* Le reflet (30 % du label) part de -40 % et finit à 130 % du label : 170 / 30 = 566,667 % de sa propre largeur */
	@keyframes sweep { 0% { transform: translateX(0) skewX(-20deg); } 30%, 100% { transform: translateX(566.667%) skewX(-20deg); } }
	.label .meta { display: flex; flex-direction: column; min-width: 0; }
	.label .k { font: 700 13px var(--kb-ui); letter-spacing: .3em; text-transform: uppercase; color: var(--kb-gold); white-space: nowrap; }
	.label .t { font: 400 46px/1.2 var(--kb-display); text-transform: uppercase; letter-spacing: .02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.label .s { font: 600 16px var(--kb-ui); letter-spacing: .14em; color: var(--kb-blue-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.label .s:empty { display: none; }
	.label .ph { width: 74px; height: 86px; align-self: flex-end; object-fit: cover; object-position: top; flex: 0 0 auto; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .6)); }
	.label .rank { width: 40px; height: 40px; object-fit: contain; flex: 0 0 auto; }

	/* Bandeau info au centre */
	.info { position: absolute; left: 690px; width: 540px; top: calc(var(--fb) + 28px); height: 106px; display: flex; flex-direction: column; align-items: center; justify-content: center; --kb-cut: 20px; }
	.info .k { font: 700 13px var(--kb-ui); letter-spacing: .28em; text-transform: uppercase; color: var(--kb-gold); white-space: nowrap; max-width: 480px; overflow: hidden; text-overflow: ellipsis; }
	.info .row { display: flex; align-items: center; gap: 14px; margin: 3px 0 1px; }
	.info .tag { font: 400 28px/1.1 var(--kb-display); letter-spacing: .04em; min-width: 70px; }
	.info .tag.a { text-align: right; }
	.info .sc { font: 400 42px/1 var(--kb-display); display: flex; gap: 12px; align-items: center; }
	.info .sc .d { color: var(--kb-gold); }
	.info .sc .l { color: var(--kb-muted); }
	.info .m { font: 700 16px var(--kb-num); letter-spacing: .22em; text-transform: uppercase; color: var(--kb-text); opacity: .9; }
	.info .live-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--kb-red); margin-right: 8px; vertical-align: 1px; animation: blink 1.4s ease-in-out infinite; }
	@keyframes blink { 50% { opacity: .25; } }
	.medal { position: absolute; left: 905px; top: calc(var(--fb) + 26px); width: 110px; height: 110px; }
	.medal img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 6px 18px rgba(0, 0, 0, .6)); animation: medal-float 5s ease-in-out infinite; }
	@keyframes medal-float { 50% { transform: translateY(-5px); } }
	.score-bump { animation: bump .8s var(--kb-ease-out); }
	@keyframes bump { 0% { transform: scale(1.5); color: #fff; } 100% { transform: none; } }
</style>
</head>
<body>
	<div id="root">
		<div id="bg" class="kb-bg"><div class="kb-bg__art"></div><div class="kb-bg__grid"></div><div class="kb-bg__stars"></div></div>
		<svg id="frames" viewBox="0 0 1920 1080"></svg>
		<div class="seam"></div>
		<div id="label-l"></div>
		<div id="label-r"></div>
		<div id="center"></div>
	</div>

<script src="../shared/kb.js"></script>
<script src="../shared/live.js"></script>
<script>
	const rep = nodecg.Replicant('liveDualCam', { defaultValue: LIVE.defaults.liveDualCam });
	const root = KB.$('#root');
	const keys = { l: null, r: null, c: null };
	let prevScore = null;

	const shape = (f, pad = 0) => {
		const x = f.x - pad, y = f.y - pad, w = f.w + pad * 2, h = f.h + pad * 2, c = f.cut + pad * 0.4;
		return [[x + c, y], [x + w, y], [x + w, y + h - c], [x + w - c, y + h], [x, y + h], [x, y + c]];
	};
	const toPath = (pts) => 'M' + pts.map((p) => p.join(' ')).join(' L') + ' Z';
	const perim = (pts) => pts.reduce((a, p, i) => { const q = pts[(i + 1) % pts.length]; return a + Math.hypot(q[0] - p[0], q[1] - p[1]); }, 0);

	// Trous + cadres dorés (dessinés une fois)
	(function drawFrames() {
		const frames = LIVE.dualFrames;
		root.style.setProperty('--fy', Math.min(...frames.map((f) => f.y)) + 'px');
		root.style.setProperty('--fb', Math.max(...frames.map((f) => f.y + f.h)) + 'px');
		KB.$('#bg').style.clipPath = `path(evenodd, "M0 0 H1920 V1080 H0 Z ${frames.map((f) => toPath(shape(f))).join(' ')}")`;
		KB.$('#frames').innerHTML = frames.map((f, i) => {
			const pts = shape(f, 2), len = Math.ceil(perim(pts));
			const x = f.x - 2, y = f.y - 2, w = f.w + 4, h = f.h + 4, L = 80;
			return `<g style="--i:${i};--len:${len}">
				<path class="glow" d="${toPath(shape(f, 9))}"/>
				<path class="edge" d="${toPath(pts)}"/>
				<path class="run" d="${toPath(pts)}"/>
				<path class="corner" d="M${x + w - L} ${y - 5} H${x + w + 5} V${y + L}"/>
				<path class="corner" d="M${x - 5} ${y + h - L} V${y + h + 5} H${x + L}"/>
			</g>`;
		}).join('');
		requestAnimationFrame(() => root.classList.add('kb-in'));
	})();

	const matchTeam = (ref) => {
		const m = KB.rep.match.value || {};
		if (ref === 'A') return KB.team(m.teamA);
		if (ref === 'B') return KB.team(m.teamB);
		return KB.team(ref);
	};

	function labelHTML(lab, side) {
		if (!lab || lab.mode === 'none') return '';
		const anim = side === 'l' ? 'kb-anim--left' : 'kb-anim--right';
		let c = 'var(--kb-gold)', k, t, s, lead = '';
		if (lab.mode === 'team') {
			const team = matchTeam(lab.team);
			if (!team && !lab.text) return '';
			c = (team && team.color) || c;
			k = 'Équipe';
			t = lab.text || (team ? team.name : '');
			s = lab.sub || (team && team.tag ? team.tag : '');
			lead = KB.teamLogo(team, 70);
		} else if (lab.mode === 'player') {
			const p = KB.player(lab.riotId);
			if (!p && !lab.text) return '';
			c = (p && p.team && p.team.color) || c;
			k = (p && KB.joinDot(p.team && p.team.tag, KB.roleLabel(p.role))) || 'Joueur';
			t = lab.text || (p ? p.name : '');
			s = lab.sub || (p && p.realName) || '';
			lead = p && p.photo ? `<img class="ph" src="${KB.esc(p.photo)}" alt="">` : (p && p.team ? KB.teamLogo(p.team, 60) : '');
			if (p && p.rank && p.rank.icon) lead += `<img class="rank" src="${KB.esc(p.rank.icon)}" alt="" title="${KB.esc(p.rank.name)}">`;
		} else {
			if (!lab.text && !lab.sub) return '';
			t = lab.text; s = lab.sub; k = '';
		}
		return `<div class="label ${side} kb-panel kb-anim ${anim}" style="--i:6;--c:${KB.esc(c)}">
			${lead}
			<div class="meta">${k ? `<div class="k">${KB.esc(k)}</div>` : ''}<div class="t">${KB.esc(t)}</div><div class="s">${KB.esc(s)}</div></div>
		</div>`;
	}

	// Ordre du bandeau central = celui des labels (l'équipe B à gauche si le label gauche montre B), sinon A à gauche
	function dualSides(v, m) {
		const ref = v.left && v.left.mode === 'team' ? v.left.team : null;
		const bLeft = ref === 'B' || (ref && ref === m.teamB);
		const A = KB.team(m.teamA), B = KB.team(m.teamB);
		return bLeft ? { left: B, right: A, leftKey: 'B', rightKey: 'A' } : { left: A, right: B, leftKey: 'A', rightKey: 'B' };
	}

	function centerHTML(v) {
		if (!v.info) return `<div class="medal kb-anim kb-anim--pop" style="--i:7"><img src="${KB.img.kbs}" alt=""></div>`;
		const m = KB.rep.match.value || {};
		const A = KB.team(m.teamA), B = KB.team(m.teamB);
		const sides = dualSides(v, m);
		const sc = KB.seriesScore(m);
		const idx = +m.currentMap || 0, cur = (m.maps || [])[idx];
		const kicker = v.infoText || KB.joinDot(m.stage, KB.formatLabel(m.format));
		if (!A && !B) return `<div class="info kb-panel kb-anim kb-anim--pop" style="--i:7"><div class="k">${KB.esc(kicker || 'KB SERIES')}</div><div class="row"><span class="tag">À suivre</span></div></div>`;
		const L = sides.left, R = sides.right, sl = sc[sides.leftKey], sr = sc[sides.rightKey];
		const tag = (t) => KB.esc(t ? t.tag || t.name : '?');
		const live = cur && cur.status === 'live';
		return `<div class="info kb-panel kb-anim kb-anim--pop" style="--i:7">
			<div class="k">${KB.esc(kicker)}</div>
			<div class="row">${KB.teamLogo(L, 34)}<span class="tag a" style="color:${KB.esc((L && L.color) || '#fff')}">${tag(L)}</span>
				<span class="sc"><span class="${sl < sr ? 'l' : ''}" data-s="l">${sl}</span><span class="d">–</span><span class="${sr < sl ? 'l' : ''}" data-s="r">${sr}</span></span>
				<span class="tag" style="color:${KB.esc((R && R.color) || '#fff')}">${tag(R)}</span>${KB.teamLogo(R, 34)}</div>
			<div class="m">${live ? '<i class="live-dot"></i>' : ''}Map ${idx + 1}${cur && cur.map ? ' · ' + KB.esc(cur.map) : ''}</div>
		</div>`;
	}

	function render() {
		const v = { ...LIVE.defaults.liveDualCam, ...(rep.value || {}) };
		for (const [side, lab] of [['l', v.left], ['r', v.right]]) {
			const html = labelHTML(lab, side);
			if (html !== keys[side]) { keys[side] = html; const el = KB.$('#label-' + side); el.innerHTML = html; KB.fit(el.querySelector('.t'), { max: 46, min: 28 }); }
		}
		const c = centerHTML(v);
		const m = KB.rep.match.value || {};
		const sc = KB.seriesScore(m);
		// Le centre n'est reconstruit (avec animation) que si sa structure change ; un changement de score anime juste le chiffre
		const struct = c.replace(/data-s="[lr]">\d+/g, '');
		if (struct !== keys.c) { keys.c = struct; KB.$('#center').innerHTML = c; }
		else if (prevScore && (sc.A !== prevScore.A || sc.B !== prevScore.B)) {
			const sides = dualSides(v, m);
			KB.$('#center').innerHTML = c; // met à jour chiffres + couleurs gagnant/perdant, sans rejouer l'entrée
			KB.$$('#center .kb-anim').forEach((x) => { x.style.animation = 'none'; x.style.opacity = 1; });
			for (const [s, k] of [['l', sides.leftKey], ['r', sides.rightKey]]) {
				const el = KB.$(`#center [data-s="${s}"]`);
				if (el && sc[k] !== prevScore[k]) el.classList.add('score-bump');
			}
		}
		prevScore = sc;
	}

	KB.watch(['match', 'teams', 'playerData', 'playerProfiles', 'valorantData', rep], render);
</script>
</body>
</html>
