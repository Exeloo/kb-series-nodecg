<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Live</title>
<!--
	Live : score de la série (maps gagnées, inverser gauche / droite).
	Écrit : match.swap. Message envoyé : live:series { team, delta }.
	Lower thirds, ticker et écran 50/50 ont chacun leur panneau (lower-thirds.html, ticker.html, dual-cam.html).
-->
<link rel="stylesheet" href="../shared/dashboard.css">
<style>
	.teamrow { display: grid; grid-template-columns: 1fr auto auto; gap: 6px; align-items: center; margin-top: 6px; }
	.teamrow .t { display: flex; align-items: center; gap: 8px; font-weight: 600; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
	.teamrow .t .hint { margin: 0; }
	.teamrow .sw { width: 12px; height: 12px; border-radius: 2px; flex: 0 0 auto; background: var(--c); }
	.teamrow .n { font: 700 18px 'Segoe UI', sans-serif; min-width: 22px; text-align: center; }
	.teamrow button { padding: 6px 10px; min-width: 40px; }
	.small { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
	<!-- ===== Score de série ===== -->
	<h3>Score de la série</h3>
	<div class="card">
		<div id="teams"></div>
		<div class="small" id="seriesInfo"></div>
		<div class="row"><button type="button" id="swap">⇄ Inverser gauche / droite</button></div>
		<div class="msg" id="sbMsg"></div>
	</div>

<script src="../shared/kb.js"></script>
<script src="../shared/live.js"></script>
<script src="../shared/dash.js"></script>
<script>
	const $ = (id) => document.getElementById(id);

	// ---------- Score de série ----------
	$('swap').onclick = () => { const m = KB.rep.match; if (m.value) m.value.swap = !m.value.swap; };
	$('teams').addEventListener('click', (e) => {
		const b = e.target.closest('button[data-t]');
		if (!b) return;
		nodecg.sendMessage('live:series', { team: b.dataset.t, delta: +b.dataset.d })
			.then((r) => KBD.flash('sbMsg', `Série : ${r.A} – ${r.B}`, 'ok', 3500))
			.catch((err) => KBD.flash('sbMsg', String((err && err.message) || err), 'err', 3500));
	});
	function renderMatch() {
		const m = KB.rep.match.value || {};
		const s = KB.seriesScore(m);
		const sides = KB.sides(m);
		const row = (team, key) => `<div class="teamrow">
			<div class="t"><span class="sw" style="--c:${KB.esc(KB.teamColor(team, key))}"></span>${KB.esc(team ? team.name : 'Équipe ' + key + ' non définie')} <span class="hint">(${key})</span></div>
			<span class="n">${s[key]}</span>
			<span><button type="button" data-t="${key}" data-d="-1">−1</button> <button type="button" class="primary" data-t="${key}" data-d="1">+1</button></span></div>`;
		$('teams').innerHTML = `<div class="hint">Maps gagnées (ordre gauche → droite à l'écran)</div>` + row(sides.left, sides.leftKey) + row(sides.right, sides.rightKey);
		const cur = (m.maps || [])[+m.currentMap || 0];
		$('seriesInfo').textContent = `${m.stage || '—'} · ${KB.formatLabel(m.format)} · Map ${(+m.currentMap || 0) + 1}${cur && cur.map ? ' : ' + cur.map : ''}${m.swap ? ' · gauche / droite inversés' : ''}`;
	}

	// Boutons −1 / +1 reconstruits à chaque score : jamais pendant un appui (deux clics rapides, le 2e serait perdu)
	KB.watch(['match', 'teams'], KBD.deferWhileEditing('teams', renderMatch));
</script>
</body>
</html>
