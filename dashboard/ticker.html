<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Ticker</title>
<!--
	Ticker défilant (bas d'écran) : visibilité immédiate, messages / vitesse / partenaires à enregistrer.
	Écrit : liveTicker ; visibilité via KBO.
-->
<link rel="stylesheet" href="../shared/dashboard.css">
</head>
<body>
	<!-- ===== Ticker ===== -->
	<h3>Ticker défilant (bas d'écran)</h3>
	<div class="card">
		<div id="tkRow"></div>
		<div id="tkForm">
			<label for="tkMsgs">Messages (un par ligne)</label>
			<textarea id="tkMsgs" rows="5"></textarea>
			<div class="grid2">
				<div><label for="tkSpeed">Vitesse (px/s)</label><input id="tkSpeed" type="number" min="20" max="400" step="10"></div>
				<div><label>&nbsp;</label><label class="chk"><input type="checkbox" id="tkPartners"> Partenaires CYCOM / EPITECH</label></div>
			</div>
		</div>
		<div class="hint lt-dirty" id="tkState"></div>
		<div class="row"><button type="button" class="primary" id="tkSave">Enregistrer le ticker</button></div>
		<div class="msg" id="tkMsg"></div>
	</div>

<script src="../shared/kb.js"></script>
<script src="../shared/live.js"></script>
<script src="../shared/dash.js"></script>
<script src="../shared/overlay-list.js"></script>
<script src="../shared/overlays.js"></script>
<script>
	const D = LIVE.defaults;
	const tk = nodecg.Replicant('liveTicker', { defaultValue: D.liveTicker });
	const $ = (id) => document.getElementById(id);
	// Écrit seulement les champs qui changent : un changement fait au même moment ailleurs (visibilité…) est préservé
	const patch = (rep, obj) => {
		if (!rep.value || typeof rep.value !== 'object') { rep.value = { ...obj }; return; }
		for (const [k, v] of Object.entries(obj)) if (JSON.stringify(rep.value[k]) !== JSON.stringify(v)) rep.value[k] = v;
	};


	// ---------- Ticker : visibilité immédiate (KBO), messages / vitesse / partenaires à enregistrer ----------
	KBO.bind('#tkRow');
	const tkLines = () => $('tkMsgs').value.split('\n').map((s) => s.trim()).filter(Boolean);
	const tkSpeed = (v) => Math.min(400, Math.max(20, +v || D.liveTicker.speed));
	const tkForm = KBD.bindDirty('tkForm', {
		read: () => ({ messages: tkLines(), speed: tkSpeed($('tkSpeed').value), partners: $('tkPartners').checked }),
		fill: (v) => { $('tkMsgs').value = v.messages.join('\n'); $('tkSpeed').value = v.speed; $('tkPartners').checked = v.partners; },
		// Même nettoyage que read() : un message importé avec un espace final ne doit pas rester « non enregistré » pour toujours
		live: () => { const v = tk.value; return v && { messages: (v.messages || []).map((s) => String(s ?? '').trim()).filter(Boolean), speed: tkSpeed(v.speed), partners: v.partners !== false }; },
		onState: (dirty) => { $('tkSave').disabled = !dirty; $('tkState').textContent = dirty ? 'Modifications non enregistrées' : ''; },
	});
	$('tkSave').onclick = () => {
		const v = { messages: tkLines(), speed: tkSpeed($('tkSpeed').value), partners: $('tkPartners').checked };
		patch(tk, v);
		$('tkMsgs').value = v.messages.join('\n'); $('tkSpeed').value = v.speed;
		KBD.flash('tkMsg', 'Ticker mis à jour', 'ok', 3500);
	};
	function renderTK() {
		const html = KBO.row('ticker');
		if ($('tkRow')._html !== html) { $('tkRow').innerHTML = html; $('tkRow')._html = html; }
		tkForm.sync();
	}

	KB.watch([tk], renderTK);
</script>
</body>
</html>
